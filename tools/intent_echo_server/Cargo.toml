[package]
name = "intent-echo-server"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_cbor = "0.11"
serde_json = "1.0"
blake3 = "1.5"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
policy_engine = { path = "../../crates/policy_engine", features = ["cbor","ed25519"] }

[target.'cfg(windows)'.dependencies]
named_pipe = "0.4"
