# ═══════════════════════════════════════════════════════════════════════════════
# POLYMERA OS - LIMINE BOOTLOADER CONFIGURATION
# ═══════════════════════════════════════════════════════════════════════════════
#
# 🦸 THE AVENGERS OF OPERATING SYSTEMS
#
# A polyglot microkernel that orchestrates Rust, Go, C++, C#, and WASM
# simultaneously, leveraging each language's superpower where it matters most.
#
# Heroes:
#   🦀 Rust    [Sentinel]     - Kernel Core, Security, Crypto
#   🐹 Go      [Coordinator]  - Services, Networking, Orchestration
#   ⚡ C++     [Speedster]    - Graphics, AI Inference, Drivers
#   🏗️ C#      [Architect]    - App Runtime, UI, Plugins
#   🔮 WASM    [Shapeshifter] - Sandboxed Extensions, Portable Drivers
#
# ═══════════════════════════════════════════════════════════════════════════════

# Boot menu timeout (seconds)
TIMEOUT=5

# Enable graphical boot menu
GRAPHICS=yes

# Verbose boot messages
VERBOSE=yes

# Default background color (dark theme)
BACKGROUND_STYLE=stretched
BACKGROUND_PATH=boot:///boot/wallpaper.bmp

# Terminal configuration
TERM_WALLPAPER=boot:///boot/wallpaper.bmp
TERM_BACKDROP=008080

# ═══════════════════════════════════════════════════════════════════════════════
# BOOT ENTRIES
# ═══════════════════════════════════════════════════════════════════════════════

:Polymera OS
    COMMENT=🦸 Avengers Microkernel - Rust + Go + C++ + C# + WASM
    PROTOCOL=limine
    KERNEL_PATH=boot:///boot/kernel.elf
    MODULE_PATH=boot:///boot/initramfs.cpio.gz
    MODULE_CMDLINE=initramfs
    CMDLINE=loglevel=7 avengers=assemble console=ttyS0,115200 console=tty0

:Polymera OS (Halo Shell)
    COMMENT=Full desktop experience with AI-native Omni-Bar
    PROTOCOL=limine
    KERNEL_PATH=boot:///boot/kernel.elf
    MODULE_PATH=boot:///boot/initramfs.cpio.gz
    MODULE_CMDLINE=initramfs
    CMDLINE=loglevel=5 avengers=assemble halo=enabled compositor=gpu ai_voice=enabled

:Polymera OS (Debug Mode)
    COMMENT=Verbose logging for development
    PROTOCOL=limine
    KERNEL_PATH=boot:///boot/kernel.elf
    MODULE_PATH=boot:///boot/initramfs.cpio.gz
    MODULE_CMDLINE=initramfs
    CMDLINE=loglevel=9 avengers=assemble debug=1 console=ttyS0,115200 earlycon

:Polymera OS (Safe Mode)
    COMMENT=Minimal boot without GPU/AI acceleration
    PROTOCOL=limine
    KERNEL_PATH=boot:///boot/kernel.elf
    MODULE_PATH=boot:///boot/initramfs.cpio.gz
    MODULE_CMDLINE=initramfs
    CMDLINE=loglevel=5 avengers=assemble safe_mode=1 nogpu noai

:Polymera OS (Recovery)
    COMMENT=Recovery shell for system repair
    PROTOCOL=limine
    KERNEL_PATH=boot:///boot/kernel.elf
    MODULE_PATH=boot:///boot/initramfs.cpio.gz
    MODULE_CMDLINE=initramfs
    CMDLINE=loglevel=7 avengers=assemble recovery=1 single

:Polymera OS (Benchmark)
    COMMENT=Performance testing mode
    PROTOCOL=limine
    KERNEL_PATH=boot:///boot/kernel.elf
    MODULE_PATH=boot:///boot/initramfs.cpio.gz
    MODULE_CMDLINE=initramfs
    CMDLINE=loglevel=3 avengers=assemble benchmark=1 isolcpus=1-3 nohz_full=1-3
