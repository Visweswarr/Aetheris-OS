[package]
name = "polymera-cosmwasm"
version = "0.1.0"
edition = "2021"
authors = ["Polymera OS Team <team@polymera-os.org>"]
description = "Polymera OS CosmWasm Smart Contracts"
license = "MIT"
repository = "https://github.com/polymera-os/polymera-os"
keywords = ["cosmwasm", "blockchain", "smart-contracts"]
categories = ["blockchain"]

[dependencies]
cosmwasm-schema = "1.4"
cosmwasm-std = "1.4"
cosmwasm-storage = "1.4"
cw-storage-plus = "1.2"
cw2 = "1.2"
cw20 = "0.20"
cw20-base = "0.20"
cw-controllers = "0.20"
cw-utils = "0.20"
schemars = "0.8"
serde = { version = "1.0", default-features = false, features = ["derive"] }
thiserror = "1.0"
anyhow = "1.0"

[dev-dependencies]
cosmwasm-schema = "1.4"
cw-multi-test = "0.20"
anyhow = "1.0"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
debug = false
strip = "symbols"
debug-assertions = false
overflow-checks = true
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.release.build-override]
opt-level = 3
debug = false
strip = "symbols"
debug-assertions = false
overflow-checks = true
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
debug-assertions = true
overflow-checks = true
panic = "unwind"

[profile.test]
opt-level = 0
debug = true
debug-assertions = true
overflow-checks = true
panic = "unwind"

[profile.bench]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = true
panic = "unwind"
