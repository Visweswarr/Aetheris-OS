[package]
name = "polymera-ipc-perf"
version = "0.1.0"
edition = "2021"
authors = ["Polymera OS Team"]
description = "Performance Testing Tools for Polymera OS"

[dependencies]
# Random number generation for latency simulation
rand = "0.8"
# Error handling and serialization
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
# Date and time handling
chrono = { version = "0.4", features = ["serde"] }
# JSON serialization
serde_json = "1.0"

[profile.dev]
opt-level = 2
debug = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[[bin]]
name = "check_ipc"
path = "check_ipc.rs"

[[bin]]
name = "check_wake_to_run"
path = "check_wake_to_run.rs"

[[bin]]
name = "check_phase1_gates"
path = "check_phase1_gates.rs"

[[bin]]
name = "check_pqc_overhead"
path = "check_pqc_overhead.rs"
