name: Reproducible Build Verification

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'kernel/**'
      - '.github/workflows/reproducible-builds.yml'
      - 'scripts/verify_reproducible_builds.py'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'kernel/**'
      - '.github/workflows/reproducible-builds.yml'
      - 'scripts/verify_reproducible_builds.py'
  workflow_dispatch: # Allow manual triggering
  schedule:
    - cron: '0 3 * * 0' # Weekly on Sundays at 3 AM UTC

jobs:
  verify-reproducible-builds:
    name: Verify Reproducible Builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install Rust toolchain
      uses: actions-rs/toolchain@v1
      with:
        toolchain: nightly
        target: x86_64-unknown-none
        override: true
        components: rust-src
        
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3 python3-pip
        
    - name: Verify reproducible builds
      run: |
        echo "🔍 Starting reproducible build verification..."
        
        # Run the verification script
        python3 scripts/verify_reproducible_builds.py kernel
        
        echo "✅ Reproducible build verification completed"
        
    - name: Upload verification report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: reproducible-build-report
        path: reproducible_build_report.md
        retention-days: 30
        
    - name: Comment on PR with results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          
          let comment = "## 🔍 Reproducible Build Verification\n\n";
          comment += "**Status**: 🔍 Running verification...\n";
          comment += "**CI Gate**: `phase-1.5-repro`\n\n";
          comment += "This PR is being tested for reproducible builds. The system will:\n";
          comment += "1. Build the kernel twice in clean environments\n";
          comment += "2. Compare artifact hashes and symbol maps\n";
          comment += "3. Verify byte-identical outputs\n\n";
          comment += "**Requirements**: All artifacts and symbol maps must be identical between builds.\n\n";
          comment += "---\n";
          comment += "*Verification in progress...*";

          // Try to read the report if it exists
          try {
            const report = fs.readFileSync('reproducible_build_report.md', 'utf8');
            
            // Check if verification passed
            if (report.includes('✅ REPRODUCIBLE BUILD VERIFICATION PASSED')) {
              comment = "## 🔍 Reproducible Build Verification\n\n";
              comment += "**Status**: ✅ **PASSED**\n";
              comment += "**CI Gate**: `phase-1.5-repro` ✅\n\n";
              comment += "The kernel build is **reproducible**! All artifacts and symbol maps are identical between builds.\n\n";
              comment += "### What was verified:\n";
              comment += "- ✅ **Build Artifacts**: Identical hashes and sizes\n";
              comment += "- ✅ **Symbol Maps**: Identical content and symbol counts\n";
              comment += "- ✅ **Reproducibility**: Deterministic build process\n\n";
              comment += "### Build Summary:\n";
              const buildSummary = report.match(/## 📊 Build Summary[\s\S]*?(?=## |$)/);
              comment += buildSummary ? buildSummary[0] : 'Details available in the full report';
              comment += "\n\n<details>\n<summary>📄 View Full Report</summary>\n\n```markdown\n";
              comment += report;
              comment += "\n```\n\n</details>\n\n";
              comment += "---\n";
              comment += "*This verification ensures the kernel can be built identically across different environments, which is crucial for security, debugging, and deployment reliability.*";
            } else if (report.includes('❌ REPRODUCIBLE BUILD VERIFICATION FAILED')) {
              comment = "## 🔍 Reproducible Build Verification\n\n";
              comment += "**Status**: ❌ **FAILED**\n";
              comment += "**CI Gate**: `phase-1.5-repro` ❌\n\n";
              comment += "The kernel build is **NOT reproducible**! Differences were detected between builds.\n\n";
              comment += "### What was verified:\n";
              comment += "- ❌ **Build Artifacts**: Hash or size differences detected\n";
              comment += "- ❌ **Symbol Maps**: Content differences detected\n";
              comment += "- ❌ **Reproducibility**: Non-deterministic build process\n\n";
              comment += "### Failure Details:\n";
              const failureDetails = report.match(/## 🔧 Artifacts Comparison[\s\S]*?(?=## |$)/);
              comment += failureDetails ? failureDetails[0] : 'Details available in the full report';
              comment += "\n\n<details>\n<summary>📄 View Full Report</summary>\n\n```markdown\n";
              comment += report;
              comment += "\n```\n\n</details>\n\n";
              comment += "### ⚠️ Action Required:\n";
              comment += "1. **Investigate non-determinism sources**\n";
              comment += "2. **Check for timestamp dependencies**\n";
              comment += "3. **Verify build tool versions**\n";
              comment += "4. **Review build scripts for non-deterministic operations**\n\n";
              comment += "**This PR cannot be merged until reproducible builds are achieved.**\n\n";
              comment += "---\n";
              comment += "*Reproducible builds are essential for security, debugging, and deployment reliability. Non-deterministic builds can lead to security vulnerabilities and debugging difficulties.*";
            }
          } catch (error) {
            // Report not available yet, use default comment
          }

          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });

  reproducible-build-baseline:
    name: Update Reproducible Build Baselines
    runs-on: ubuntu-latest
    needs: verify-reproducible-builds
    if: github.ref == 'refs/heads/main' && success()
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install Rust toolchain
      uses: actions-rs/toolchain@v1
      with:
        toolchain: nightly
        target: x86_64-unknown-none
        override: true
        components: rust-src
        
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3 python3-pip
        
    - name: Generate reproducible build baseline
      run: |
        echo "📊 Generating reproducible build baseline for main branch..."
        
        # Run verification to generate baseline
        python3 scripts/verify_reproducible_builds.py kernel
        
        echo "Baseline generation completed"
        
    - name: Commit baseline updates
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        git add -A
        git commit -m "Update reproducible build baseline from verification" || echo "No changes to commit"
        
    - name: Push baseline updates
      run: |
        git push origin main || echo "No changes to push"
