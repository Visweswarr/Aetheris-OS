name: P4-03 Network Scale & Performance Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'services/net/**'
      - 'go/tooling/**'
      - 'tooling/**'
      - 'perf/**'
      - '.github/workflows/p4-03-net-scale.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'services/net/**'
      - 'go/tooling/**'
      - 'tooling/**'
      - 'perf/**'
      - '.github/workflows/p4-03-net-scale.yml'
  schedule:
    # Run daily at 3 AM UTC
    - cron: '0 3 * * *'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_LOG: info

jobs:
  # Mini benchmark tests for CI (2-core runners)
  mini-benchmark:
    name: Mini Benchmark Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        test-type: ['tcp', 'tls', 'concurrent']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: stable
        components: rustfmt, clippy
    
    - name: Install Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          build-essential \
          libssl-dev \
          pkg-config \
          libclang-dev \
          libudev-dev \
          python3 \
          python3-pip
    
    - name: Install Python dependencies
      run: |
        pip install pyyaml aiohttp
    
    - name: Build components
      run: |
        # Build crypto module
        cd crypto
        cargo build --release --features full
        
        # Build networking services
        cd ../services/net/posixnet
        cargo build --release
        
        # Build Go tools
        cd ../../../go/tooling/netctl
        go build -o netctl .
    
    - name: Run mini benchmark tests
      run: |
        cd go/tooling/netctl
        
        # Create results directory
        mkdir -p runs
        
        # Run mini benchmarks based on test type
        case "${{ matrix.test-type }}" in
          "tcp")
            echo "Running mini TCP benchmark..."
            timeout 5m ./netctl bench tcp --clients 100 --duration 1m --json runs/mini_tcp.json || true
            ;;
          "tls")
            echo "Running mini TLS benchmark..."
            timeout 5m ./netctl bench tls --clients 50 --duration 1m --json runs/mini_tls.json || true
            ;;
          "concurrent")
            echo "Running mini concurrent benchmark..."
            timeout 5m ./netctl bench concurrent --clients 2000 --duration 2m --json runs/mini_concurrent.json || true
            ;;
        esac
    
    - name: Validate benchmark results
      run: |
        cd go/tooling/netctl
        
        # Check if results files exist and are valid JSON
        for result_file in runs/mini_*.json; do
          if [ -f "$result_file" ]; then
            echo "Validating $result_file..."
            python3 -c "import json; json.load(open('$result_file'))"
            echo "✅ $result_file is valid"
          else
            echo "⚠️ $result_file not found"
          fi
        done
    
    - name: Upload mini benchmark results
      uses: actions/upload-artifact@v3
      with:
        name: mini-benchmark-results-${{ matrix.test-type }}
        path: go/tooling/netctl/runs/mini_*.json
        if-no-files-found: ignore

  # Performance regression tests
  performance-regression:
    name: Performance Regression Tests
    runs-on: ubuntu-latest
    needs: mini-benchmark
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: stable
    
    - name: Install Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
    
    - name: Install Python dependencies
      run: |
        pip install pyyaml aiohttp
    
    - name: Download mini benchmark results
      uses: actions/download-artifact@v3
      with:
        name: mini-benchmark-results-tcp
        path: runs/
    
    - name: Build components
      run: |
        # Build crypto module
        cd crypto
        cargo build --release --features full
        
        # Build networking services
        cd ../services/net/posixnet
        cargo build --release
        
        # Build Go tools
        cd ../../../go/tooling/netctl
        go build -o netctl .
    
    - name: Run performance regression tests
      run: |
        cd go/tooling/netctl
        
        # Create results directory
        mkdir -p runs
        
        # Run regression tests
        echo "Running performance regression tests..."
        
        # TCP regression test
        timeout 10m ./netctl bench tcp --clients 1000 --duration 3m --json runs/regression_tcp.json || true
        
        # TLS regression test
        timeout 10m ./netctl bench tls --clients 500 --duration 3m --json runs/regression_tls.json || true
        
        # Concurrent regression test
        timeout 10m ./netctl bench concurrent --clients 5000 --duration 5m --json runs/regression_concurrent.json || true
    
    - name: Check performance regressions
      run: |
        cd go/tooling/netctl
        
        # Check for regressions against baseline
        python3 ../../../tooling/python/net_report.py check-regressions \
          runs/regression_tcp.json \
          clients_1000_tls_false_duration_30000 \
          --threshold 10.0 || echo "TCP regression check completed"
        
        python3 ../../../tooling/python/net_report.py check-regressions \
          runs/regression_tls.json \
          clients_1000_tls_true_duration_30000 \
          --threshold 10.0 || echo "TLS regression check completed"
        
        python3 ../../../tooling/python/net_report.py check-regressions \
          runs/regression_concurrent.json \
          clients_10000_tls_false_duration_1800000 \
          --threshold 10.0 || echo "Concurrent regression check completed"
    
    - name: Generate performance report
      run: |
        cd go/tooling/netctl
        
        # Generate aggregated report
        python3 ../../../tooling/python/net_report.py report \
          runs/regression_*.json \
          --output runs/performance_report.txt || true
        
        # Display report
        if [ -f runs/performance_report.txt ]; then
          echo "Performance Report:"
          echo "==================="
          cat runs/performance_report.txt
        fi
    
    - name: Upload performance results
      uses: actions/upload-artifact@v3
      with:
        name: performance-regression-results
        path: go/tooling/netctl/runs/
        if-no-files-found: ignore

  # Flamegraph generation on regressions
  flamegraph-analysis:
    name: Flamegraph Analysis
    runs-on: ubuntu-latest
    needs: performance-regression
    if: failure() || github.event_name == 'schedule'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: stable
    
    - name: Install Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
    
    - name: Install flamegraph tools
      run: |
        # Install perf and flamegraph tools
        sudo apt-get update
        sudo apt-get install -y \
          linux-tools-generic \
          linux-tools-common \
          cargo
        
        # Install flamegraph
        cargo install flamegraph
    
    - name: Build components with profiling
      run: |
        # Build crypto module
        cd crypto
        cargo build --release --features full
        
        # Build networking services
        cd ../services/net/posixnet
        cargo build --release
        
        # Build Go tools
        cd ../../../go/tooling/netctl
        go build -o netctl .
    
    - name: Generate flamegraphs
      run: |
        cd go/tooling/netctl
        
        # Create flamegraph directory
        mkdir -p perf/artifacts
        
        # Generate flamegraph for TCP benchmark
        echo "Generating flamegraph for TCP benchmark..."
        RUST_LOG=info PERF=on timeout 5m ./netctl bench tcp --clients 100 --duration 1m || true
        
        # Generate flamegraph for TLS benchmark
        echo "Generating flamegraph for TLS benchmark..."
        RUST_LOG=info PERF=on timeout 5m ./netctl bench tls --clients 50 --duration 1m || true
        
        # Generate flamegraph for concurrent benchmark
        echo "Generating flamegraph for concurrent benchmark..."
        RUST_LOG=info PERF=on timeout 5m ./netctl bench concurrent --clients 1000 --duration 2m || true
    
    - name: Upload flamegraphs
      uses: actions/upload-artifact@v3
      with:
        name: flamegraph-artifacts
        path: go/tooling/netctl/perf/artifacts/
        if-no-files-found: ignore

  # Baseline update on release tags
  baseline-update:
    name: Baseline Update
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: stable
    
    - name: Install Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
    
    - name: Install Python dependencies
      run: |
        pip install pyyaml aiohttp
    
    - name: Build components
      run: |
        # Build crypto module
        cd crypto
        cargo build --release --features full
        
        # Build networking services
        cd ../services/net/posixnet
        cargo build --release
        
        # Build Go tools
        cd ../../../go/tooling/netctl
        go build -o netctl .
    
    - name: Run baseline benchmarks
      run: |
        cd go/tooling/netctl
        
        # Create results directory
        mkdir -p runs
        
        # Run baseline benchmarks
        echo "Running baseline benchmarks for release ${{ github.ref_name }}..."
        
        # TCP baseline
        timeout 15m ./netctl bench tcp --clients 1000 --duration 5m --record-baseline --json runs/baseline_tcp.json || true
        
        # TLS baseline
        timeout 15m ./netctl bench tls --clients 1000 --duration 5m --record-baseline --json runs/baseline_tls.json || true
        
        # Concurrent baseline
        timeout 30m ./netctl bench concurrent --clients 10000 --duration 10m --record-baseline --json runs/baseline_concurrent.json || true
    
    - name: Update baseline file
      run: |
        cd go/tooling/netctl
        
        # Update baseline file with new metrics
        python3 ../../../tooling/python/net_report.py update-baseline runs/baseline_tcp.json || true
        python3 ../../../tooling/python/net_report.py update-baseline runs/baseline_tls.json || true
        python3 ../../../tooling/python/net_report.py update-baseline runs/baseline_concurrent.json || true
    
    - name: Commit baseline updates
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        # Add baseline file
        git add perf/baselines/p4_03_net_adv.json
        
        # Commit if there are changes
        if git diff --staged --quiet; then
          echo "No baseline changes to commit"
        else
          git commit -m "Update network performance baselines for release ${{ github.ref_name }}"
          git push
        fi
    
    - name: Upload baseline results
      uses: actions/upload-artifact@v3
      with:
        name: baseline-results-${{ github.ref_name }}
        path: go/tooling/netctl/runs/baseline_*.json
        if-no-files-found: ignore

  # TypeScript benchmark tests
  typescript-benchmark:
    name: TypeScript Benchmark Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies
      run: |
        cd tooling/ts
        npm install typescript @types/node
    
    - name: Compile TypeScript benchmark
      run: |
        cd tooling/ts
        npx tsc net-bench.ts
    
    - name: Run TypeScript benchmark
      run: |
        cd tooling/ts
        
        # Create results directory
        mkdir -p runs
        
        # Run mini TypeScript benchmark
        echo "Running TypeScript benchmark..."
        timeout 5m node net-bench.js --clients 100 --duration 1m --json runs/ts_benchmark.json || true
    
    - name: Validate TypeScript benchmark results
      run: |
        cd tooling/ts
        
        # Check if results file exists and is valid JSON
        if [ -f runs/ts_benchmark.json ]; then
          echo "Validating TypeScript benchmark results..."
          python3 -c "import json; json.load(open('runs/ts_benchmark.json'))"
          echo "✅ TypeScript benchmark results are valid"
        else
          echo "⚠️ TypeScript benchmark results not found"
        fi
    
    - name: Upload TypeScript benchmark results
      uses: actions/upload-artifact@v3
      with:
        name: typescript-benchmark-results
        path: tooling/ts/runs/
        if-no-files-found: ignore

  # Final status check
  status-check:
    name: Status Check
    runs-on: ubuntu-latest
    needs: [mini-benchmark, performance-regression, typescript-benchmark]
    if: always()
    
    steps:
    - name: Check all jobs status
      run: |
        echo "Mini Benchmark: ${{ needs.mini-benchmark.result }}"
        echo "Performance Regression: ${{ needs.performance-regression.result }}"
        echo "TypeScript Benchmark: ${{ needs.typescript-benchmark.result }}"
        
        if [[ "${{ needs.mini-benchmark.result }}" != "success" || 
              "${{ needs.performance-regression.result }}" != "success" || 
              "${{ needs.typescript-benchmark.result }}" != "success" ]]; then
          echo "Some tests failed!"
          exit 1
        else
          echo "All tests passed!"
        fi
