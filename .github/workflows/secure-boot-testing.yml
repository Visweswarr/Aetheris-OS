# Secure Boot Testing
# Tests kernel signing, verification, and secure boot functionality

name: "Secure Boot Testing"

on:
  # Manual trigger for secure boot testing
  workflow_dispatch:
    inputs:
      test_dev_bypass:
        description: 'Test development bypass functionality'
        required: false
        default: true
        type: boolean
      test_production_mode:
        description: 'Test production mode verification'
        required: false
        default: true
        type: boolean
      run_qemu_tests:
        description: 'Run QEMU boot tests'
        required: false
        default: true
        type: boolean
  # Secure boot testing on security-related changes
  pull_request:
    paths:
      - 'kernel/src/boot/**'
      - 'tooling/attest/**'
      - 'docs/phase-2/SECURE-BOOT-DEV.md'
  # Secure boot testing on main branch
  push:
    branches: [ main, develop ]
    paths:
      - 'kernel/src/boot/**'
      - 'tooling/attest/**'
      - 'docs/phase-2/SECURE-BOOT-DEV.md'

env:
  RUST_BACKTRACE: 1
  RUST_LOG: info
  KERNEL_PACKAGE: polymera-kernel
  ATTEST_DIR: tooling/attest

jobs:
  # Build and Test Attestation Tools
  build-attestation-tools:
    name: "Build Attestation Tools"
    runs-on: ubuntu-latest
    
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: "Setup Rust toolchain"
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          components: rustfmt, clippy
      
      - name: "Cache Rust dependencies"
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-attest-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-attest-
      
      - name: "Build attestation tools"
        run: |
          cd ${{ env.ATTEST_DIR }}
          cargo build --release --bin kernel-signer
          cargo build --release --bin kernel-verifier
          echo "Attestation tools built successfully"
      
      - name: "Test attestation tools"
        run: |
          cd ${{ env.ATTEST_DIR }}
          cargo test --release
          echo "Attestation tool tests passed"
      
      - name: "Upload attestation tools"
        uses: actions/upload-artifact@v3
        with:
          name: attestation-tools-${{ github.sha }}
          path: |
            ${{ env.ATTEST_DIR }}/target/release/kernel-signer
            ${{ env.ATTEST_DIR }}/target/release/kernel-verifier

  # Kernel Signing and Verification
  kernel-signing-verification:
    name: "Kernel Signing & Verification"
    runs-on: ubuntu-latest
    needs: [build-attestation-tools]
    
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4
      
      - name: "Setup Rust toolchain"
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
      
      - name: "Cache Rust dependencies"
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-attest-${{ hashFiles('**/Cargo.lock') }}
      
      - name: "Download attestation tools"
        uses: actions/download-artifact@v3
        with:
          name: attestation-tools-${{ github.sha }}
          path: ${{ env.ATTEST_DIR }}/target/release/
      
      - name: "Make tools executable"
        run: |
          chmod +x ${{ env.ATTEST_DIR }}/target/release/kernel-signer
          chmod +x ${{ env.ATTEST_DIR }}/target/release/kernel-verifier
      
      - name: "Generate test keys"
        run: |
          # Generate test Dilithium2 keypair (simulated)
          mkdir -p test-keys
          
          # Create a test private key (1312 bytes for public key + 1388 bytes for private key)
          dd if=/dev/urandom of=test-keys/dev-key.pem bs=1 count=2560
          
          # Create a test certificate (extract first 1312 bytes as public key)
          head -c 1312 test-keys/dev-key.pem > test-keys/dev-cert.pem
          
          echo "Test keys generated"
      
      - name: "Build kernel"
        run: |
          # Build the kernel package
          cargo build --release --package ${{ env.KERNEL_PACKAGE }}
          
          # Check if kernel binary exists
          if [[ -f "target/release/${{ env.KERNEL_PACKAGE }}.bin" ]]; then
            echo "Kernel binary found: target/release/${{ env.KERNEL_PACKAGE }}.bin"
          else
            # Create a dummy kernel binary for testing
            echo "Creating dummy kernel binary for testing"
            dd if=/dev/urandom of=target/release/${{ env.KERNEL_PACKAGE }}.bin bs=1 count=10240
          fi
      
      - name: "Sign kernel with development key"
        run: |
          cd ${{ env.ATTEST_DIR }}
          
          # Sign kernel with development key
          ./target/release/kernel-signer \
            -i ../../target/release/${{ env.KERNEL_PACKAGE }}.bin \
            -o ../../target/release/signed-kernel-dev.bin \
            -k ../../test-keys/dev-key.pem \
            -t development \
            -f
          
          echo "Kernel signed with development key"
      
      - name: "Sign kernel with production key"
        run: |
          cd ${{ env.ATTEST_DIR }}
          
          # Sign kernel with production key
          ./target/release/kernel-signer \
            -i ../../target/release/${{ env.KERNEL_PACKAGE }}.bin \
            -o ../../target/release/signed-kernel-prod.bin \
            -k ../../test-keys/dev-key.pem \
            -t production \
            -b "test-production" \
            -f
          
          echo "Kernel signed with production key"
      
      - name: "Verify development signed kernel"
        run: |
          cd ${{ env.ATTEST_DIR }}
          
          # Verify development signed kernel
          ./target/release/kernel-verifier \
            -v \
            -t development \
            -c ../../test-keys/dev-cert.pem \
            ../../target/release/signed-kernel-dev.bin
          
          echo "Development kernel verification passed"
      
      - name: "Verify production signed kernel"
        run: |
          cd ${{ env.ATTEST_DIR }}
          
          # Verify production signed kernel
          ./target/release/kernel-verifier \
            -v \
            -t production \
            -c ../../test-keys/dev-cert.pem \
            ../../target/release/signed-kernel-prod.bin
          
          echo "Production kernel verification passed"
      
      - name: "Test invalid signature rejection"
        run: |
          cd ${{ env.ATTEST_DIR }}
          
          # Create a corrupted signed kernel
          cp ../../target/release/signed-kernel-dev.bin ../../target/release/corrupted-kernel.bin
          
          # Corrupt the signature (change some bytes)
          dd if=/dev/urandom of=../../target/release/corrupted-kernel.bin bs=1 seek=1400 count=100 conv=notrunc
          
          # This should fail verification
          if ./target/release/kernel-verifier ../../target/release/corrupted-kernel.bin; then
            echo "❌ Corrupted kernel verification should have failed"
            exit 1
          else
            echo "✅ Corrupted kernel correctly rejected"
          fi
      
      - name: "Upload signed kernels"
        uses: actions/upload-artifact@v3
        with:
          name: signed-kernels-${{ github.sha }}
          path: |
            target/release/signed-kernel-dev.bin
            target/release/signed-kernel-prod.bin
            test-keys/

  # QEMU Boot Testing
  qemu-boot-testing:
    name: "QEMU Boot Testing"
    runs-on: ubuntu-latest
    needs: [kernel-signing-verification]
    if: ${{ github.event.inputs.run_qemu_tests != 'false' }}
    
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4
      
      - name: "Setup QEMU"
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils
          qemu-system-x86_64 --version
      
      - name: "Download signed kernels"
        uses: actions/download-artifact@v3
        with:
          name: signed-kernels-${{ github.sha }}
          path: target/release/
      
      - name: "Test development mode boot (with bypass)"
        run: |
          echo "Testing development mode boot with bypass..."
          
          # Test boot with development bypass
          timeout 30s qemu-system-x86_64 \
            -kernel target/release/signed-kernel-dev.bin \
            -append "DEV_BYPASS=1" \
            -serial stdio \
            -nographic \
            -no-reboot \
            -no-shutdown \
            -m 128M \
            -cpu qemu64 \
            -machine type=pc,accel=tcg | tee dev-boot-with-bypass.log
          
          # Check for expected output
          if grep -q "Development bypass enabled" dev-boot-with-bypass.log; then
            echo "✅ Development bypass boot successful"
          else
            echo "❌ Development bypass boot failed"
            exit 1
          fi
      
      - name: "Test development mode boot (without bypass)"
        run: |
          echo "Testing development mode boot without bypass..."
          
          # Test boot without development bypass
          timeout 30s qemu-system-x86_64 \
            -kernel target/release/signed-kernel-dev.bin \
            -serial stdio \
            -nographic \
            -no-reboot \
            -no-shutdown \
            -m 128M \
            -cpu qemu64 \
            -machine type=pc,accel=tcg | tee dev-boot-no-bypass.log
          
          # Check for expected output
          if grep -q "Kernel signature verification successful" dev-boot-no-bypass.log; then
            echo "✅ Development mode boot successful"
          else
            echo "❌ Development mode boot failed"
            exit 1
          fi
      
      - name: "Test production mode boot"
        run: |
          echo "Testing production mode boot..."
          
          # Test boot with production signed kernel
          timeout 30s qemu-system-x86_64 \
            -kernel target/release/signed-kernel-prod.bin \
            -serial stdio \
            -nographic \
            -no-reboot \
            -no-shutdown \
            -m 128M \
            -cpu qemu64 \
            -machine type=pc,accel=tcg | tee prod-boot.log
          
          # Check for expected output
          if grep -q "Kernel signature verification successful" prod-boot.log; then
            echo "✅ Production mode boot successful"
          else
            echo "❌ Production mode boot failed"
            exit 1
          fi
      
      - name: "Test unsigned kernel rejection"
        run: |
          echo "Testing unsigned kernel rejection..."
          
          # Create an unsigned kernel
          dd if=/dev/urandom of=target/release/unsigned-kernel.bin bs=1 count=10240
          
          # This should fail to boot
          timeout 30s qemu-system-x86_64 \
            -kernel target/release/unsigned-kernel.bin \
            -serial stdio \
            -nographic \
            -no-reboot \
            -no-shutdown \
            -m 128M \
            -cpu qemu64 \
            -machine type=pc,accel=tcg | tee unsigned-boot.log
          
          # Check for expected failure
          if grep -q "Invalid attestation header" unsigned-boot.log || \
             grep -q "Kernel signature verification failed" unsigned-boot.log; then
            echo "✅ Unsigned kernel correctly rejected"
          else
            echo "❌ Unsigned kernel should have been rejected"
            exit 1
          fi
      
      - name: "Upload boot test logs"
        uses: actions/upload-artifact@v3
        with:
          name: boot-test-logs-${{ github.sha }}
          path: |
            dev-boot-with-bypass.log
            dev-boot-no-bypass.log
            prod-boot.log
            unsigned-boot.log

  # Security Validation
  security-validation:
    name: "Security Validation"
    runs-on: ubuntu-latest
    needs: [kernel-signing-verification]
    
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4
      
      - name: "Download signed kernels"
        uses: actions/download-artifact@v3
        with:
          name: signed-kernels-${{ github.sha }}
          path: target/release/
      
      - name: "Validate signature uniqueness"
        run: |
          echo "Validating signature uniqueness..."
          
          # Extract signatures from both kernels
          dd if=target/release/signed-kernel-dev.bin bs=1 skip=1400 count=2701 of=dev-signature.bin
          dd if=target/release/signed-kernel-prod.bin bs=1 skip=1400 count=2701 of=prod-signature.bin
          
          # Check that signatures are different
          if cmp -s dev-signature.bin prod-signature.bin; then
            echo "❌ Signatures should be different for different build types"
            exit 1
          else
            echo "✅ Signatures are unique for different build types"
          fi
      
      - name: "Validate certificate consistency"
        run: |
          echo "Validating certificate consistency..."
          
          # Extract certificates from both kernels
          dd if=target/release/signed-kernel-dev.bin bs=1 skip=40 count=1312 of=dev-cert.bin
          dd if=target/release/signed-kernel-prod.bin bs=1 skip=40 count=1312 of=prod-cert.bin
          
          # Check that certificates are the same (same key used)
          if cmp -s dev-cert.bin prod-cert.bin; then
            echo "✅ Certificates are consistent (same key used)"
          else
            echo "❌ Certificates should be the same for same key"
            exit 1
          fi
      
      - name: "Validate build ID uniqueness"
        run: |
          echo "Validating build ID uniqueness..."
          
          # Extract build IDs from both kernels
          dd if=target/release/signed-kernel-dev.bin bs=1 skip=8 count=32 of=dev-build-id.bin
          dd if=target/release/signed-kernel-prod.bin bs=1 skip=8 count=32 of=prod-build-id.bin
          
          # Check that build IDs are different
          if cmp -s dev-build-id.bin prod-build-id.bin; then
            echo "❌ Build IDs should be different for different builds"
            exit 1
          else
            echo "✅ Build IDs are unique for different builds"
          fi
      
      - name: "Validate header structure"
        run: |
          echo "Validating header structure..."
          
          # Check magic number
          dd if=target/release/signed-kernel-dev.bin bs=1 count=4 of=magic.bin
          if [[ "$(cat magic.bin)" == "POLY" ]]; then
            echo "✅ Magic number correct"
          else
            echo "❌ Magic number incorrect: $(cat magic.bin)"
            exit 1
          fi
          
          # Check version
          dd if=target/release/signed-kernel-dev.bin bs=1 skip=4 count=1 of=version.bin
          version=$(od -An -tu1 version.bin)
          if [[ "$version" == "1" ]]; then
            echo "✅ Version correct: $version"
          else
            echo "❌ Version incorrect: $version"
            exit 1
          fi
          
          # Check flags
          dd if=target/release/signed-kernel-dev.bin bs=1 skip=5 count=1 of=flags.bin
          flags=$(od -An -tu1 flags.bin)
          echo "Flags: 0x$(printf '%02x' $flags)"
          
          # Check development flags
          if [[ $((flags & 0x01)) -eq 1 ]]; then
            echo "✅ Development flag set"
          else
            echo "❌ Development flag not set"
            exit 1
          fi
      
      - name: "Upload validation artifacts"
        uses: actions/upload-artifact@v3
        with:
          name: security-validation-${{ github.sha }}
          path: |
            dev-signature.bin
            prod-signature.bin
            dev-cert.bin
            prod-cert.bin
            dev-build-id.bin
            prod-build-id.bin
            magic.bin
            version.bin
            flags.bin

  # Final Security Report
  security-report:
    name: "Security Report"
    runs-on: ubuntu-latest
    needs: [build-attestation-tools, kernel-signing-verification, qemu-boot-testing, security-validation]
    if: always()
    
    steps:
      - name: "Generate security report"
        run: |
          cat > secure-boot-security-report.md << EOF
          # Secure Boot Security Report
          
          **Generated**: $(date -u +"%Y-%m-%dT%H:%M:%SZ")
          **Commit**: ${{ github.sha }}
          **Branch**: ${{ github.ref_name }}
          
          ## Test Results Summary
          
          | Test Category | Status | Details |
          |---------------|--------|---------|
          | Attestation Tools Build | ${{ needs.build-attestation-tools.result == 'success' && '✅ PASSED' || '❌ FAILED' }} | Build and test attestation tools |
          | Kernel Signing | ${{ needs.kernel-signing-verification.result == 'success' && '✅ PASSED' || '❌ FAILED' }} | Sign kernels with dev/prod keys |
          | QEMU Boot Testing | ${{ needs.qemu-boot-testing.result == 'success' && '✅ PASSED' || '❌ FAILED' }} | Boot signed kernels in QEMU |
          | Security Validation | ${{ needs.security-validation.result == 'success' && '✅ PASSED' || '❌ FAILED' }} | Validate security properties |
          
          ## Security Assessment
          
          **Overall Status**: ${{ (needs.build-attestation-tools.result == 'success' && needs.kernel-signing-verification.result == 'success' && needs.qemu-boot-testing.result == 'success' && needs.security-validation.result == 'success') && '✅ SECURE' || '❌ INSECURE' }}
          
          ### Security Properties Validated
          
          - **Signature Uniqueness**: ${{ needs.security-validation.result == 'success' && '✅' || '❌' }} Signatures are unique per build
          - **Certificate Consistency**: ${{ needs.security-validation.result == 'success' && '✅' || '❌' }} Certificates are consistent
          - **Build ID Uniqueness**: ${{ needs.security-validation.result == 'success' && '✅' || '❌' }} Build IDs are unique per build
          - **Header Structure**: ${{ needs.security-validation.result == 'success' && '✅' || '❌' }} Header structure is valid
          - **Development Bypass**: ${{ needs.qemu-boot-testing.result == 'success' && '✅' || '❌' }} Development bypass works correctly
          - **Signature Verification**: ${{ needs.qemu-boot-testing.result == 'success' && '✅' || '❌' }} Signature verification works correctly
          
          ### Security Recommendations
          
          ${{ (needs.build-attestation-tools.result == 'success' && needs.kernel-signing-verification.result == 'success' && needs.qemu-boot-testing.result == 'success' && needs.security-validation.result == 'success') && '1. ✅ Continue with current implementation\n2. ✅ Monitor for security regressions\n3. ✅ Regular security testing recommended\n4. ✅ Ready for development deployment' || '1. ❌ Investigate failed security tests\n2. ❌ Fix security vulnerabilities\n3. ❌ Re-run security validation\n4. ❌ Block deployment until resolved' }}
          
          ## Next Steps
          
          ${{ (needs.build-attestation-tools.result == 'success' && needs.kernel-signing-verification.result == 'success' && needs.qemu-boot-testing.result == 'success' && needs.security-validation.result == 'success') && '**Ready for Phase 2 deployment**\n\nAll security validations passed. The secure boot system meets development requirements and can proceed to production hardening.' || '**Security investigation required**\n\nSome security tests failed. Deployment blocked until security issues are resolved.' }}
          
          ---
          
          **Secure Boot Security Validation**: ${{ (needs.build-attestation-tools.result == 'success' && needs.kernel-signing-verification.result == 'success' && needs.qemu-boot-testing.result == 'success' && needs.security-validation.result == 'success') && 'PASSED - SECURE' || 'FAILED - INSECURE' }}
          EOF
      
      - name: "Upload security report"
        uses: actions/upload-artifact@v3
        with:
          name: secure-boot-security-report-${{ github.sha }}
          path: secure-boot-security-report.md
      
      - name: "Comment on PR (if applicable)"
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('secure-boot-security-report.md', 'utf8');
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });
      
      - name: "Final security status"
        run: |
          if [[ "${{ needs.build-attestation-tools.result }}" == "success" && \
                "${{ needs.kernel-signing-verification.result }}" == "success" && \
                "${{ needs.qemu-boot-testing.result }}" == "success" && \
                "${{ needs.security-validation.result }}" == "success" ]]; then
            echo "🔒 Secure Boot Security: VALIDATED"
            echo "✅ All security tests passed"
            echo "✅ Development bypass working"
            echo "✅ Signature verification working"
            echo "✅ Ready for development deployment"
          else
            echo "🚨 Secure Boot Security: FAILED"
            echo "❌ Some security tests failed"
            echo "❌ Security investigation required"
            echo "❌ Deployment blocked"
            exit 1
          fi
