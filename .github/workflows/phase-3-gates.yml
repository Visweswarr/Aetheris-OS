    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [ngfs-schema]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          
      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Setup Bazel
        uses: bazelbuild/setup-bazelisk@v2
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
      
      - name: Install Python dependencies
        run: |
          pip install pytest hypothesis cbor2
      
      - name: Install Node.js dependencies
        run: |
          npm install -g typescript
      
      - name: Build vault targets
        run: |
          echo "Building NGFS vault targets..."
          bazel build //services/ngfs:ngfs-vault
          bazel build //services/identity:did-vault
          bazel build //go/tools:ngfs-vault
          bazel build //tooling/python:vault_check
          bazel build //ui/vault:vault-ui
      
      - name: Run vault tests
        run: |
          echo "Running NGFS vault tests..."
          bazel test //tests/vault:did_vault_test
          bazel test //tooling/python:tests/test_vault_check
      
      - name: Test vault operations
        run: |
          echo "Testing vault operations..."
          mkdir -p /tmp/vault-test
          
          # Test add operation with valid CapToken
          ./bazel-bin/go/tools/ngfs-vault --op add --id test-key --kind key --file /tmp/vault-test/test.key --cap tests/vault/fixtures/sample_key.cap
          
          # Test list operation
          ./bazel-bin/go/tools/ngfs-vault --op list --cap tests/vault/fixtures/sample_key.cap
          
          # Test show operation
          ./bazel-bin/go/tools/ngfs-vault --op show --id test-key --cap tests/vault/fixtures/sample_key.cap
      
      - name: Test CapToken enforcement
        run: |
          echo "Testing CapToken enforcement..."
          
          # Test with restricted CapToken (should fail for write operations)
          if ./bazel-bin/go/tools/ngfs-vault --op add --id restricted-key --kind key --file /tmp/vault-test/restricted.key --cap tests/vault/fixtures/restricted.cap 2>/dev/null; then
            echo "ERROR: Restricted CapToken should not allow write operations"
            exit 1
          else
            echo "✓ Restricted CapToken correctly denied write operation"
          fi
          
          # Test with expired CapToken (should fail for all operations)
          if ./bazel-bin/go/tools/ngfs-vault --op list --cap tests/vault/fixtures/expired.cap 2>/dev/null; then
            echo "ERROR: Expired CapToken should not allow any operations"
            exit 1
          else
            echo "✓ Expired CapToken correctly denied operations"
          fi
      
      - name: Run vault capability tests
        run: |
          echo "Running vault capability tests..."
          python3 tooling/python/vault_check.py --fixtures tests/vault/fixtures --cap tests/vault/fixtures/sample_key.cap --operations add,list,show,delete
      
      - name: Validate vault fixtures
        run: |
          echo "Validating vault fixtures..."
          
          # Check that all CapToken fixtures are valid JSON
          for cap_file in tests/vault/fixtures/*.cap; do
            echo "Validating $cap_file..."
            if ! python3 -m json.tool "$cap_file" > /dev/null; then
              echo "ERROR: Invalid JSON in $cap_file"
              exit 1
            fi
            echo "✓ $cap_file is valid JSON"
          done
      
      - name: Upload vault results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: ngfs-vault-results
          path: |
            /tmp/vault-test/
            tests/vault/fixtures/
      
      - name: Verify vault gates
        run: |
          echo "Verifying vault gates..."
          echo "NGFS vault tests completed successfully"
          echo "All vault tools built and tested"
          echo "CapToken enforcement verified"
          echo "Vault operations validated"

  ngfs-contract:
    name: NGFS Smart Contract Sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [ngfs-schema]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          
      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
          
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Setup Bazel
        uses: bazelbuild/setup-bazelisk@v2
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
      
      - name: Install Python dependencies
        run: |
          pip install pytest hypothesis cbor2
      
      - name: Install Node.js dependencies
        run: |
          npm install -g typescript @types/react @types/react-dom
          npm install --save-dev jest @testing-library/react @testing-library/jest-dom
      
      - name: Build contract targets
        run: |
          echo "Building NGFS contract targets..."
          bazel build //services/contracts:contract-sandbox
          bazel build //c/zkvm:libaeth_zkvm
          bazel build //go/tools:ngfs-contract
          bazel build //tooling/python:contract_check
          bazel build //ui/contracts:contract-ui
      
      - name: Run contract tests
        run: |
          echo "Running NGFS contract tests..."
          bazel test //tests/contracts:sandbox_smoke_test
          bazel test //tooling/python:tests/test_contract_check
          bazel test //ui/contracts:tests/test_contract_ui
      
      - name: Test contract execution
        run: |
          echo "Testing contract execution..."
          mkdir -p /tmp/contract-test
          
          # Test basic contract execution
          ./bazel-bin/go/tools/ngfs-contract run --contract tests/contracts/fixtures/increment.wasm --input tests/contracts/fixtures/increment_input.json --gas 100000 --json
          
          # Test ZK proof generation
          ./bazel-bin/go/tools/ngfs-contract run --contract tests/contracts/fixtures/validator.wasm --input tests/contracts/fixtures/validator_input.json --gas 1000000 --zk --algorithm halo2 --json
      
      - name: Test contract validation
        run: |
          echo "Testing contract validation..."
          
          # Run the Python validator on fixtures
          python3 tooling/python/contract_check.py --fixtures tests/contracts/fixtures --ngfs-contract ./bazel-bin/go/tools/ngfs-contract --verbose --output /tmp/contract-validation-report.txt
          
          # Check validation results
          if [ -f /tmp/contract-validation-report.txt ]; then
            echo "Contract validation report:"
            cat /tmp/contract-validation-report.txt
          fi
      
      - name: Test ZK proof verification
        run: |
          echo "Testing ZK proof verification..."
          
          # Test different ZK algorithms
          for algorithm in halo2 noir plonk; do
            echo "Testing $algorithm algorithm..."
            ./bazel-bin/go/tools/ngfs-contract run --contract tests/contracts/fixtures/validator.wasm --input tests/contracts/fixtures/validator_input.json --gas 1000000 --zk --algorithm $algorithm --json
          done
      
      - name: Validate contract fixtures
        run: |
          echo "Validating contract fixtures..."
          
          # Check that all WASM files exist and have content
          for wasm_file in tests/contracts/fixtures/*.wasm; do
            echo "Validating $wasm_file..."
            if [ ! -s "$wasm_file" ]; then
              echo "ERROR: Empty or missing WASM file: $wasm_file"
              exit 1
            fi
            echo "✓ $wasm_file is valid"
          done
          
          # Check that all input JSON files are valid
          for json_file in tests/contracts/fixtures/*_input.json; do
            echo "Validating $json_file..."
            if ! python3 -m json.tool "$json_file" > /dev/null; then
              echo "ERROR: Invalid JSON in $json_file"
              exit 1
            fi
            echo "✓ $json_file is valid JSON"
          done
      
      - name: Upload contract results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: ngfs-contract-results
          path: |
            /tmp/contract-test/
            /tmp/contract-validation-report.txt
            tests/contracts/fixtures/
      
      - name: Verify contract gates
        run: |
          echo "Verifying contract gates..."
          echo "NGFS contract tests completed successfully"
          echo "All contract tools built and tested"
          echo "Contract execution validated"
          echo "ZK proof generation verified"
          echo "Contract validation completed"

