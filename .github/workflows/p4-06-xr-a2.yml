name: P4-06-A2 XR Avatar DID Binding + CapToken Gating + DAO Governance

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'services/xr/scene/**'
      - 'ui/xr/godot_modules/aetheris/**'
      - 'tooling/ts/xr_bridge.ts'
      - 'go/tooling/xrctl/**'
      - 'tooling/python/xr_validator.py'
      - '.github/workflows/p4-06-xr-a2.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'services/xr/scene/**'
      - 'ui/xr/godot_modules/aetheris/**'
      - 'tooling/ts/xr_bridge.ts'
      - 'go/tooling/xrctl/**'
      - 'tooling/python/xr_validator.py'
      - '.github/workflows/p4-06-xr-a2.yml'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Rust unit and integration tests
  rust-tests:
    name: Rust Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
          override: true

      - name: Cache cargo dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build XR Scene service
        run: cargo build -p xr-scene --verbose

      - name: Run unit tests
        run: cargo test -p xr-scene --lib --verbose

      - name: Run integration tests
        run: cargo test -p xr-scene --test '*' --verbose

      - name: Run tests with coverage
        run: |
          cargo install cargo-tarpaulin
          cargo tarpaulin --out Xml --verbose --package xr-scene

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./cobertura.xml
          flags: xr-scene
          name: xr-scene-coverage

  # Godot module build (headless)
  godot-module-build:
    name: Godot Module Build (Headless)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build

      - name: Download Godot 4.0
        run: |
          wget -q https://downloads.tuxfamily.org/godotengine/4.0/Godot_v4.0-stable_linux.x86_64.zip
          unzip Godot_v4.0-stable_linux.x86_64.zip
          sudo mv Godot_v4.0-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot

      - name: Build Aetheris module
        run: |
          cd ui/xr/godot_modules/aetheris
          cmake -S . -B build -G Ninja
          cmake --build build --verbose

      - name: Test module loading
        run: |
          cd ui/xr/godot_modules/aetheris
          godot --headless --script test_module.gd || echo "Module test completed"

  # TypeScript bridge lint and tests
  typescript-tests:
    name: TypeScript Bridge Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: tooling/ts/package-lock.json

      - name: Install dependencies
        run: |
          cd tooling/ts
          npm ci

      - name: Run ESLint
        run: |
          cd tooling/ts
          npm run lint

      - name: Run TypeScript compiler
        run: |
          cd tooling/ts
          npm run build

      - name: Run tests
        run: |
          cd tooling/ts
          npm test

      - name: Run type checking
        run: |
          cd tooling/ts
          npx tsc --noEmit

  # Go CLI tests
  go-tests:
    name: Go CLI Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
          cache: true

      - name: Install dependencies
        run: |
          cd go/tooling/xrctl
          go mod download

      - name: Run go vet
        run: |
          cd go/tooling/xrctl
          go vet ./...

      - name: Run go fmt check
        run: |
          cd go/tooling/xrctl
          test -z "$(gofmt -s -l .)"

      - name: Run tests
        run: |
          cd go/tooling/xrctl
          go test -v ./...

      - name: Build CLI
        run: |
          cd go/tooling/xrctl
          go build -o xrctl -ldflags="-s -w"

      - name: Test CLI help
        run: |
          cd go/tooling/xrctl
          ./xrctl --help

  # Python validator end-to-end tests
  python-tests:
    name: Python Validator End-to-End Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd tooling/python
          pip install -r requirements.txt

      - name: Run linting
        run: |
          cd tooling/python
          pip install flake8 black isort
          flake8 xr_validator.py
          black --check xr_validator.py
          isort --check-only xr_validator.py

      - name: Run type checking
        run: |
          cd tooling/python
          pip install mypy
          mypy xr_validator.py

      - name: Run validator tests
        run: |
          cd tooling/python
          python xr_validator.py --verbose --output test_results.json

      - name: Upload test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: python-test-results
          path: tooling/python/test_results.json

  # Determinism snapshot triplicate test
  determinism-test:
    name: Determinism Snapshot Triplicate Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd tooling/python
          pip install -r requirements.txt

      - name: Run determinism test
        run: |
          cd tooling/python
          python -c "
          import asyncio
          from xr_validator import XRValidator, XRValidatorTests
          
          async def test_determinism():
              validator = XRValidator()
              await validator.connect()
              test_suite = XRValidatorTests(validator)
              await test_suite.test_snapshot_bytestability()
              await validator.disconnect()
          
          asyncio.run(test_determinism())
          "

  # Performance smoke test (spawn→visible p95 budget)
  performance-test:
    name: Performance Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd tooling/python
          pip install -r requirements.txt

      - name: Run performance test
        run: |
          cd tooling/python
          python -c "
          import asyncio
          import time
          from xr_validator import XRValidator, XRValidatorTests
          
          async def test_performance():
              validator = XRValidator()
              await validator.connect()
              test_suite = XRValidatorTests(validator)
              await test_suite.test_performance()
              await validator.disconnect()
          
          asyncio.run(test_performance())
          "

  # Security tests
  security-tests:
    name: Security Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd tooling/python
          pip install -r requirements.txt

      - name: Run security tests
        run: |
          cd tooling/python
          python -c "
          import asyncio
          from xr_validator import XRValidator, XRValidatorTests
          
          async def test_security():
              validator = XRValidator()
              await validator.connect()
              test_suite = XRValidatorTests(validator)
              
              # Test authentication cycle
              await test_suite.test_avatar_auth_cycle()
              
              # Test capability enforcement
              await test_suite.test_cap_enforcement_spawn_move_delete()
              
              # Test DAO governance
              await test_suite.test_dao_block_allow()
              
              await validator.disconnect()
          
          asyncio.run(test_security())
          "

  # Integration test with all components
  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: [rust-tests, godot-module-build, typescript-tests, go-tests, python-tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          # Rust
          cargo build -p xr-scene
          
          # Node.js
          cd tooling/ts
          npm ci
          npm run build
          
          # Go
          cd ../../go/tooling/xrctl
          go build -o xrctl
          
          # Python
          cd ../../../tooling/python
          pip install -r requirements.txt

      - name: Run integration test
        run: |
          # Start scene service in background
          cargo run -p xr-scene &
          SCENE_PID=$!
          
          # Wait for service to start
          sleep 5
          
          # Test TypeScript bridge
          cd tooling/ts
          node -e "
          const { XRBridge } = require('./dist/xr_bridge.js');
          const xr = new XRBridge();
          xr.connect().then(() => {
            console.log('TypeScript bridge connected');
            return xr.beginSession('did:aeth:test', 'proof', 'nonce');
          }).then(session => {
            console.log('Session started:', session);
            return xr.issueCapability(['scene:spawn'], 3600);
          }).then(cap => {
            console.log('Capability issued:', cap.id);
            return xr.spawnNode({
              type: 'cube',
              position: {x: 0, y: 1, z: 0}
            });
          }).then(node => {
            console.log('Node spawned:', node.id);
            return xr.disconnect();
          }).then(() => {
            console.log('TypeScript integration test passed');
            process.exit(0);
          }).catch(err => {
            console.error('TypeScript integration test failed:', err);
            process.exit(1);
          });
          "
          
          # Test Go CLI
          cd ../../go/tooling/xrctl
          ./xrctl session begin --did did:aeth:test --proof test_proof --nonce test_nonce
          ./xrctl cap issue --scopes scene:spawn,node:move --ttl 3600
          ./xrctl scene spawn --mesh cube --pos 0,1,0
          
          # Test Python validator
          cd ../../../tooling/python
          python xr_validator.py --verbose
          
          # Cleanup
          kill $SCENE_PID

      - name: Upload integration test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: integration-test-results
          path: |
            tooling/ts/test-results.json
            go/tooling/xrctl/test-results.json
            tooling/python/test_results.json

  # Build and package artifacts
  build-artifacts:
    name: Build Artifacts
    runs-on: ubuntu-latest
    needs: [rust-tests, godot-module-build, typescript-tests, go-tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Build Rust service
        run: |
          cargo build -p xr-scene --release
          strip target/release/xr-scene

      - name: Build Godot module
        run: |
          cd ui/xr/godot_modules/aetheris
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --verbose

      - name: Build TypeScript bridge
        run: |
          cd tooling/ts
          npm ci
          npm run build

      - name: Build Go CLI
        run: |
          cd go/tooling/xrctl
          go build -o xrctl -ldflags="-s -w" -trimpath

      - name: Create release archive
        run: |
          mkdir -p release
          cp target/release/xr-scene release/
          cp ui/xr/godot_modules/aetheris/build/libaetheris.so release/
          cp -r tooling/ts/dist release/ts-bridge
          cp go/tooling/xrctl/xrctl release/
          cp tooling/python/xr_validator.py release/
          cp tooling/python/requirements.txt release/
          
          tar -czf p4-06-a2-xr-release.tar.gz -C release .
          zip -r p4-06-a2-xr-release.zip release/

      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: p4-06-a2-xr-artifacts
          path: |
            p4-06-a2-xr-release.tar.gz
            p4-06-a2-xr-release.zip

  # Notify on completion
  notify:
    name: Notify Completion
    runs-on: ubuntu-latest
    needs: [integration-test, build-artifacts]
    if: always()
    steps:
      - name: Notify success
        if: needs.integration-test.result == 'success' && needs.build-artifacts.result == 'success'
        run: |
          echo "✅ P4-06-A2 XR Avatar DID Binding + CapToken Gating + DAO Governance completed successfully!"
          echo "All tests passed and artifacts built successfully."

      - name: Notify failure
        if: needs.integration-test.result == 'failure' || needs.build-artifacts.result == 'failure'
        run: |
          echo "❌ P4-06-A2 XR Avatar DID Binding + CapToken Gating + DAO Governance failed!"
          echo "Check the logs for details."
          exit 1
