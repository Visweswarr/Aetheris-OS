name: Phase 5 - AI Orchestrator & Assistant

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'services/ai/**'
      - 'c/libc_aetheris/ai_orchestrator.*'
      - 'go/tooling/devctl/ai_orchestrator.go'
      - 'tooling/ts/ai_orchestrator.ts'
      - 'tooling/python/ai_orchestrator_validator.py'
      - 'schemas/ai.orchestrator.events.cddl'
      - 'schemas/ai.assistant.events.cddl'
      - 'docs/phase-5/**'
      - '.github/workflows/phase5.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'services/ai/**'
      - 'c/libc_aetheris/ai_orchestrator.*'
      - 'go/tooling/devctl/ai_orchestrator.go'
      - 'tooling/ts/ai_orchestrator.ts'
      - 'tooling/python/ai_orchestrator_validator.py'
      - 'schemas/ai.orchestrator.events.cddl'
      - 'schemas/ai.assistant.events.cddl'
      - 'docs/phase-5/**'
      - '.github/workflows/phase5.yml'
  workflow_dispatch:
    inputs:
      run_extended_tests:
        description: 'Run extended tests'
        required: false
        default: false
        type: boolean

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ============================================================================
  # Rust Build & Test
  # ============================================================================
  rust-build:
    name: Rust Build & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        feature: [phase5, phase5+onnx, phase5+whisper]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        components: rustfmt, clippy
    
    - name: Cache Rust dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ matrix.feature }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-${{ matrix.feature }}-
          ${{ runner.os }}-cargo-
    
    - name: Build AI service
      run: |
        cd services/ai
        cargo build --features ${{ matrix.feature }} --verbose
    
    - name: Run tests
      run: |
        cd services/ai
        cargo test --features ${{ matrix.feature }} --verbose
        
    - name: Run AI drift gates
      run: |
        cd services/ai_core
        cargo test drift --verbose
        
    - name: Run AI performance gates
      run: |
        cd services/ai_core
        cargo bench --verbose

    - name: Run clippy
      run: |
        cd services/ai
        cargo clippy --features ${{ matrix.feature }} -- -D warnings
    
    - name: Check formatting
      run: |
        cd services/ai
        cargo fmt -- --check

  # ============================================================================
  # C FFI Build & Test
  # ============================================================================
  c-ffi-build:
    name: C FFI Build & Test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc make
    
    - name: Build C FFI
      run: |
        cd c/libc_aetheris
        gcc -c ai_orchestrator.c -o ai_orchestrator.o
        gcc -shared ai_orchestrator.o -o libai_orchestrator.so
    
    - name: Test C FFI
      run: |
        cd c/libc_aetheris
        # Create a simple test program
        cat > test_ai_orchestrator.c << 'EOF'
        #include "ai_orchestrator.h"
        #include <stdio.h>
        #include <assert.h>
        
        int main() {
            // Test orchestrator initialization
            aetheris_ai_orchestrator_config_t config = {
                .max_pipelines = 4,
                .model_cache_mb = 512,
                .deterministic = true,
                .verify_supply_chain = true,
                .enable_monitoring = true
            };
            
            aetheris_ai_error_t result = AetherAI_Orchestrator_Init(&config);
            assert(result == AETHERIS_AI_SUCCESS);
            
            // Test assistant initialization
            aetheris_ai_assistant_config_t asst_config = {
                .max_context_tokens = 4096,
                .max_tool_invocations = 10,
                .deterministic = true,
                .enable_memory = true,
                .memory_retention_secs = 3600,
                .enable_multimodal = true
            };
            
            result = AetherAI_Assistant_Init(&asst_config);
            assert(result == AETHERIS_AI_SUCCESS);
            
            // Test model loading
            aetheris_ai_model_load_config_t model_config = {
                .model_path = "test_model.onnx",
                .backend = AETHERIS_AI_BACKEND_CPU,
                .enable_quantization = true,
                .enable_optimization = true,
                .verify_signatures = true,
                .verify_supply_chain = true,
                .cache_in_memory = true,
                .deterministic = true
            };
            
            char model_id[64];
            result = AetherAI_ModelLoader_LoadModel(&model_config, model_id);
            assert(result == AETHERIS_AI_SUCCESS);
            
            printf("All C FFI tests passed!\n");
            return 0;
        }
        EOF
        
        gcc test_ai_orchestrator.c ai_orchestrator.c -o test_ai_orchestrator
        ./test_ai_orchestrator

  # ============================================================================
  # Go CLI Build & Test
  # ============================================================================
  go-cli-build:
    name: Go CLI Build & Test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.22'
    
    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-
    
    - name: Build devctl
      run: |
        cd go/tooling/devctl
        go build -o devctl .
    
    - name: Test AI Orchestrator commands
      run: |
        cd go/tooling/devctl
        
        # Test orchestrator init
        ./devctl ai orch init --json
        
        # Test orchestrator start
        ./devctl ai orch start vision yolo_v8 --json
        
        # Test orchestrator list
        ./devctl ai orch list --json
        
        # Test orchestrator stats
        ./devctl ai orch stats --json
        
        # Test assistant init
        ./devctl ai asst init --json
        
        # Test assistant plan
        ./devctl ai asst plan "Test request" --context "Test context" --json
        
        # Test assistant stats
        ./devctl ai asst stats --json
        
        # Test model load
        ./devctl ai model load test_model.onnx --json
        
        # Test model list
        ./devctl ai model list --json
        
        # Test model stats
        ./devctl ai model stats --json

  # ============================================================================
  # TypeScript Build & Test
  # ============================================================================
  typescript-build:
    name: TypeScript Build & Test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Install dependencies
      run: |
        cd tooling/ts
        npm install
    
    - name: TypeScript type check
      run: |
        cd tooling/ts
        npx tsc --noEmit ai_orchestrator.ts
    
    - name: Test TypeScript bridge
      run: |
        cd tooling/ts
        cat > test_ai_orchestrator.js << 'EOF'
        const { AIOrchestrator, AIAssistant, AIModelLoader } = require('./ai_orchestrator.ts');
        
        async function testAIOrchestrator() {
            const orchestrator = new AIOrchestrator();
            await orchestrator.init({
                maxPipelines: 4,
                modelCacheMB: 512,
                deterministic: true,
                verifySupplyChain: true,
                enableMonitoring: true
            });
            
            const pipelineId = await orchestrator.startPipeline('vision', 'yolo_v8');
            console.log('Pipeline started:', pipelineId);
            
            const stats = await orchestrator.getStats();
            console.log('Orchestrator stats:', stats);
        }
        
        async function testAIAssistant() {
            const assistant = new AIAssistant();
            await assistant.init({
                maxContextTokens: 4096,
                maxToolInvocations: 10,
                deterministic: true,
                enableMemory: true,
                memoryRetentionSecs: 3600,
                enableMultimodal: true
            });
            
            const planId = await assistant.plan('Test request', 'Test context');
            console.log('Plan created:', planId);
            
            const stats = await assistant.getStats();
            console.log('Assistant stats:', stats);
        }
        
        async function testAIModelLoader() {
            const modelLoader = new AIModelLoader();
            const modelId = await modelLoader.loadModel({
                modelPath: 'test_model.onnx',
                backend: 'cpu',
                enableQuantization: true,
                enableOptimization: true,
                verifySignatures: true,
                verifySupplyChain: true,
                cacheInMemory: true,
                deterministic: true
            });
            
            console.log('Model loaded:', modelId);
            
            const stats = await modelLoader.getStats();
            console.log('Model loader stats:', stats);
        }
        
        async function runTests() {
            try {
                await testAIOrchestrator();
                await testAIAssistant();
                await testAIModelLoader();
                console.log('All TypeScript tests passed!');
            } catch (error) {
                console.error('TypeScript test failed:', error);
                process.exit(1);
            }
        }
        
        runTests();
        EOF
        
        node test_ai_orchestrator.js

  # ============================================================================
  # Python Validator
  # ============================================================================
  python-validator:
    name: Python Validator
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run AI Orchestrator validator
      run: |
        python tooling/python/ai_orchestrator_validator.py --smoke --verbose --output artifacts/ai_orchestrator_validation.json
    
    - name: Upload validation results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: ai-orchestrator-validation-results
        path: artifacts/ai_orchestrator_validation.json

  # ============================================================================
  # CBOR Schema Validation
  # ============================================================================
  cbor-schema-validation:
    name: CBOR Schema Validation
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install CDDL tools
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-pip
        pip3 install cddl
    
    - name: Validate orchestrator schema
      run: |
        python3 -c "
        import cddl
        import sys
        
        try:
            # Load and validate orchestrator schema
            with open('schemas/ai.orchestrator.events.cddl', 'r') as f:
                schema = f.read()
            
            # Basic syntax check
            if 'ai_orchestrator_event' in schema and 'ai_orchestrator_event_type' in schema:
                print('✅ Orchestrator schema syntax is valid')
            else:
                print('❌ Orchestrator schema syntax is invalid')
                sys.exit(1)
                
        except Exception as e:
            print(f'❌ Orchestrator schema validation failed: {e}')
            sys.exit(1)
        "
    
    - name: Validate assistant schema
      run: |
        python3 -c "
        import cddl
        import sys
        
        try:
            # Load and validate assistant schema
            with open('schemas/ai.assistant.events.cddl', 'r') as f:
                schema = f.read()
            
            # Basic syntax check
            if 'ai_assistant_event' in schema and 'ai_assistant_event_type' in schema:
                print('✅ Assistant schema syntax is valid')
            else:
                print('❌ Assistant schema syntax is invalid')
                sys.exit(1)
                
        except Exception as e:
            print(f'❌ Assistant schema validation failed: {e}')
            sys.exit(1)
        "

    - name: Validate phase5a contracts schema
      run: |
        python3 -c "
        import cddl
        import sys
        
        try:
            # Load and validate phase5a contracts schema
            with open('schemas/ai.phase5a.contracts.cddl', 'r') as f:
                schema = f.read()
            
            # Basic syntax check
            if 'fusion-request' in schema and 'audit-event' in schema:
                print('✅ Phase5a contracts schema syntax is valid')
            else:
                print('❌ Phase5a contracts schema syntax is invalid')
                sys.exit(1)
                
        except Exception as e:
            print(f'❌ Phase5a contracts schema validation failed: {e}')
            sys.exit(1)
        "

  # ============================================================================
  # Documentation Check
  # ============================================================================
  docs-check:
    name: Documentation Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Check Phase 5 documentation
      run: |
        if [ -f "docs/phase-5/PHASE-5-OVERVIEW.md" ]; then
            echo "✅ Phase 5 documentation exists"
            
            # Check for required sections
            if grep -q "## Overview" docs/phase-5/PHASE-5-OVERVIEW.md && \
               grep -q "## Architecture" docs/phase-5/PHASE-5-OVERVIEW.md && \
               grep -q "## API Surface" docs/phase-5/PHASE-5-OVERVIEW.md && \
               grep -q "## Determinism" docs/phase-5/PHASE-5-OVERVIEW.md && \
               grep -q "## Performance" docs/phase-5/PHASE-5-OVERVIEW.md && \
               grep -q "## Security" docs/phase-5/PHASE-5-OVERVIEW.md && \
               grep -q "## Testing" docs/phase-5/PHASE-5-OVERVIEW.md; then
                echo "✅ Phase 5 documentation has all required sections"
            else
                echo "❌ Phase 5 documentation is missing required sections"
                exit 1
            fi
        else
            echo "❌ Phase 5 documentation does not exist"
            exit 1
        fi

  # ============================================================================
  # Extended Tests (Optional)
  # ============================================================================
  extended-tests:
    name: Extended Tests
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.run_extended_tests == 'true' || github.event_name == 'workflow_dispatch' }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Run extended AI tests
      run: |
        echo "Running extended AI Orchestrator & Assistant tests..."
        
        # Run comprehensive validation
        python tooling/python/ai_orchestrator_validator.py --smoke --verbose --output artifacts/extended_validation.json
        
        # Run performance tests
        echo "Running performance tests..."
        # Add performance test commands here
        
        # Run security tests
        echo "Running security tests..."
        # Add security test commands here
        
        echo "Extended tests completed"

  # ============================================================================
  # Summary
  # ============================================================================
  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [rust-build, c-ffi-build, go-cli-build, typescript-build, python-validator, cbor-schema-validation, docs-check]
    if: always()
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Generate summary
      run: |
        echo "## Phase 5 - AI Orchestrator & Assistant Test Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Rust Build & Test | ${{ needs.rust-build.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| C FFI Build & Test | ${{ needs.c-ffi-build.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Go CLI Build & Test | ${{ needs.go-cli-build.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| TypeScript Build & Test | ${{ needs.typescript-build.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Python Validator | ${{ needs.python-validator.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| CBOR Schema Validation | ${{ needs.cbor-schema-validation.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Documentation Check | ${{ needs.docs-check.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ "${{ needs.rust-build.result }}" == "success" ] && \
           [ "${{ needs.c-ffi-build.result }}" == "success" ] && \
           [ "${{ needs.go-cli-build.result }}" == "success" ] && \
           [ "${{ needs.typescript-build.result }}" == "success" ] && \
           [ "${{ needs.python-validator.result }}" == "success" ] && \
           [ "${{ needs.cbor-schema-validation.result }}" == "success" ] && \
           [ "${{ needs.docs-check.result }}" == "success" ]; then
            echo "🎉 **All Phase 5 tests passed!**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Phase 5 - AI Orchestrator & Assistant Layer is ready for production use." >> $GITHUB_STEP_SUMMARY
        else
            echo "❌ **Some Phase 5 tests failed!**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Please check the failed components and fix the issues." >> $GITHUB_STEP_SUMMARY
        fi
