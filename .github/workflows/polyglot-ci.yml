name: Polyglot Foundation

on:
  pull_request:
    paths:
      - "configs/polyglot-toolchain.toml"
      - "scripts/bootstrap-polyglot-tools.*"
      - "scripts/verify-polyglot.*"
      - "wit/**"
      - "services/ai_core/**"
      - "services/wasm_driver/**"
      - "services/supervisor/**"
      - "runtime/examples/hello_component/**"
      - ".github/workflows/polyglot-ci.yml"
  push:
    branches: [main, develop]

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bootstrap repo-pinned polyglot tools
        run: bash scripts/bootstrap-polyglot-tools.sh

      - name: Install package-local TypeScript dependencies
        run: |
          if [ -f tooling/ts/package.json ]; then npm --prefix tooling/ts install; fi
          if [ -f apps/assistant-ui/package.json ]; then npm --prefix apps/assistant-ui install; fi

      - name: Verify polyglot foundation
        run: bash scripts/verify-polyglot.sh
