# Phase 1 Kernel Validation Workflow
# Enforces SPEC → DESIGN → TASKS → CODE/TESTS → DOCS pattern

name: Phase 1 Kernel Validation

on:
  pull_request:
    paths:
      - 'kernel/**'
      - 'docs/phase-1/**'
      - '.github/workflows/phase1-validation.yml'
  push:
    branches:
      - main
      - 'phase1/**'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Rule enforcement: SPEC/DESIGN deltas required for kernel changes
  spec-design-validation:
    name: SPEC/DESIGN Delta Validation
    runs-on: ubuntu-22.04
    if: github.event_name == 'pull_request'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Need full history for diff analysis
        
    - name: Check for kernel code changes
      id: kernel-changes
      run: |
        # Check if PR touches kernel code
        KERNEL_CHANGES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '^kernel/' || true)
        echo "kernel_changes<<EOF" >> $GITHUB_OUTPUT
        echo "$KERNEL_CHANGES" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
        
        if [ -n "$KERNEL_CHANGES" ]; then
          echo "has_kernel_changes=true" >> $GITHUB_OUTPUT
          echo "Found kernel changes:"
          echo "$KERNEL_CHANGES"
        else
          echo "has_kernel_changes=false" >> $GITHUB_OUTPUT
          echo "No kernel changes detected"
        fi
        
    - name: Check for SPEC/DESIGN updates
      id: spec-design-changes
      if: steps.kernel-changes.outputs.has_kernel_changes == 'true'
      run: |
        # Check if SPEC.md or DESIGN.md were updated
        SPEC_CHANGES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E 'docs/phase-1/(SPEC|DESIGN)\.md' || true)
        echo "spec_design_changes<<EOF" >> $GITHUB_OUTPUT
        echo "$SPEC_CHANGES" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
        
        if [ -n "$SPEC_CHANGES" ]; then
          echo "has_spec_design_changes=true" >> $GITHUB_OUTPUT
          echo "Found SPEC/DESIGN updates:"
          echo "$SPEC_CHANGES"
        else
          echo "has_spec_design_changes=false" >> $GITHUB_OUTPUT
          echo "No SPEC/DESIGN updates found"
        fi
        
    - name: Validate SPEC/DESIGN delta requirement
      if: steps.kernel-changes.outputs.has_kernel_changes == 'true'
      run: |
        if [ "${{ steps.spec-design-changes.outputs.has_spec_design_changes }}" = "false" ]; then
          echo "❌ VALIDATION FAILED"
          echo ""
          echo "Phase 1 Rule Violation: SPEC → DESIGN → TASKS → CODE/TESTS → DOCS"
          echo ""
          echo "This PR modifies kernel code but does not include corresponding"
          echo "updates to SPEC.md or DESIGN.md documentation."
          echo ""
          echo "Kernel files changed:"
          echo "${{ steps.kernel-changes.outputs.kernel_changes }}"
          echo ""
          echo "Required actions:"
          echo "1. Update docs/phase-1/SPEC.md if requirements changed"
          echo "2. Update docs/phase-1/DESIGN.md if architecture changed"
          echo "3. Ensure documentation reflects your code changes"
          echo ""
          echo "For more information, see: docs/phase-1/README.md"
          exit 1
        else
          echo "✅ SPEC/DESIGN delta requirement satisfied"
          echo "Found documentation updates:"
          echo "${{ steps.spec-design-changes.outputs.spec_design_changes }}"
        fi

  # Build validation for all kernel targets
  kernel-build:
    name: Kernel Build Validation
    runs-on: ubuntu-22.04
    needs: spec-design-validation
    if: always() && (needs.spec-design-validation.result == 'success' || needs.spec-design-validation.result == 'skipped')
    
    strategy:
      matrix:
        target: [x86_64-unknown-uefi, aarch64-unknown-uefi]
        
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: nightly
        targets: ${{ matrix.target }}
        components: rustfmt, clippy
        
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          qemu-system-x86 \
          qemu-system-arm \
          ovmf \
          gcc-aarch64-linux-gnu
          
    - name: Cache Rust dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          kernel/target
        key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
        
    - name: Check code formatting
      working-directory: kernel
      run: cargo fmt --all -- --check
      
    - name: Run Clippy lints
      working-directory: kernel
      run: cargo clippy --target ${{ matrix.target }} --all-targets -- -D warnings
      
    - name: Build kernel for target
      working-directory: kernel
      run: |
        echo "Building kernel for ${{ matrix.target }}"
        cargo build --target ${{ matrix.target }} --release
        
    - name: Verify kernel binary
      working-directory: kernel
      run: |
        BINARY_PATH="target/${{ matrix.target }}/release"
        if [ "${{ matrix.target }}" = "x86_64-unknown-uefi" ]; then
          BINARY_NAME="kernel_uefi_x64"
        else
          BINARY_NAME="kernel_uefi_aarch64"
        fi
        
        if [ -f "$BINARY_PATH/$BINARY_NAME" ]; then
          echo "✅ Kernel binary built successfully: $BINARY_PATH/$BINARY_NAME"
          file "$BINARY_PATH/$BINARY_NAME"
          ls -lh "$BINARY_PATH/$BINARY_NAME"
        else
          echo "❌ Kernel binary not found: $BINARY_PATH/$BINARY_NAME"
          exit 1
        fi

  # Unit testing for kernel components
  kernel-unit-tests:
    name: Kernel Unit Tests
    runs-on: ubuntu-22.04
    needs: spec-design-validation
    if: always() && (needs.spec-design-validation.result == 'success' || needs.spec-design-validation.result == 'skipped')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: nightly
        components: llvm-tools-preview
        
    - name: Install cargo-llvm-cov for coverage
      uses: taiki-e/install-action@cargo-llvm-cov
        
    - name: Cache Rust dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          kernel/target
        key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
        
    - name: Run unit tests with coverage
      working-directory: kernel
      run: |
        # Run tests on host target (for unit testing)
        cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info
        
    - name: Check test coverage threshold
      working-directory: kernel
      run: |
        # Extract coverage percentage
        COVERAGE=$(cargo llvm-cov --all-features --workspace --summary-only | grep "lines" | awk '{print $3}' | sed 's/%//')
        echo "Test coverage: ${COVERAGE}%"
        
        # Require >90% coverage for Phase 1
        MIN_COVERAGE=90
        if (( $(echo "$COVERAGE < $MIN_COVERAGE" | bc -l) )); then
          echo "❌ Test coverage $COVERAGE% is below required $MIN_COVERAGE%"
          exit 1
        else
          echo "✅ Test coverage $COVERAGE% meets requirement (>$MIN_COVERAGE%)"
        fi
        
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: kernel/lcov.info
        flags: kernel-unit-tests
        name: kernel-coverage

  # QEMU integration testing
  qemu-integration-tests:
    name: QEMU Integration Tests
    runs-on: ubuntu-22.04
    needs: kernel-build
    if: always() && needs.kernel-build.result == 'success'
    
    strategy:
      matrix:
        arch: [x86_64, aarch64]
        
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: nightly
        targets: ${{ matrix.arch }}-unknown-uefi
        
    - name: Install QEMU and UEFI firmware
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          qemu-system-x86 \
          qemu-system-arm \
          ovmf \
          qemu-efi-aarch64
          
    - name: Cache Rust dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          kernel/target
        key: ${{ runner.os }}-cargo-${{ matrix.arch }}-${{ hashFiles('**/Cargo.lock') }}
        
    - name: Build kernel for testing
      working-directory: kernel
      run: |
        cargo build --target ${{ matrix.arch }}-unknown-uefi --release
        
    - name: Setup QEMU test environment
      run: |
        mkdir -p qemu-test
        
        if [ "${{ matrix.arch }}" = "x86_64" ]; then
          cp kernel/target/x86_64-unknown-uefi/release/kernel_uefi_x64 qemu-test/
          QEMU_CMD="qemu-system-x86_64"
          QEMU_ARGS="-machine q35 -cpu qemu64 -m 512M -smp 2 -bios /usr/share/ovmf/OVMF.fd"
        else
          cp kernel/target/aarch64-unknown-uefi/release/kernel_uefi_aarch64 qemu-test/
          QEMU_CMD="qemu-system-aarch64"
          QEMU_ARGS="-machine virt -cpu cortex-a72 -m 512M -smp 2 -bios /usr/share/qemu-efi-aarch64/QEMU_EFI.fd"
        fi
        
        echo "QEMU_CMD=$QEMU_CMD" >> $GITHUB_ENV
        echo "QEMU_ARGS=$QEMU_ARGS" >> $GITHUB_ENV
        
    - name: Run QEMU boot test
      run: |
        cd qemu-test
        
        # Create a simple boot test script
        cat > boot_test.sh << 'EOF'
        #!/bin/bash
        set -e
        
        # Start QEMU in background
        timeout 60s $QEMU_CMD $QEMU_ARGS \
          -drive format=raw,file=fat:rw:. \
          -serial stdio \
          -monitor none \
          -display none \
          -no-reboot \
          -no-shutdown > boot_log.txt 2>&1 &
          
        QEMU_PID=$!
        
        # Wait for boot completion or timeout
        for i in {1..30}; do
          if grep -q "Polymera OS kernel is now running" boot_log.txt 2>/dev/null; then
            echo "✅ Kernel boot successful"
            kill $QEMU_PID 2>/dev/null || true
            exit 0
          fi
          sleep 2
        done
        
        echo "❌ Kernel boot timeout or failure"
        kill $QEMU_PID 2>/dev/null || true
        cat boot_log.txt
        exit 1
        EOF
        
        chmod +x boot_test.sh
        ./boot_test.sh
        
    - name: Upload boot logs
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: qemu-boot-logs-${{ matrix.arch }}
        path: qemu-test/boot_log.txt

  # SLO gate validation
  slo-gate-validation:
    name: SLO Gate Validation
    runs-on: ubuntu-22.04
    needs: qemu-integration-tests
    if: always() && needs.qemu-integration-tests.result == 'success'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Rust toolchain for SLO tools
      uses: dtolnay/rust-toolchain@stable
      
    - name: Build SLO checker
      working-directory: perf
      run: |
        cargo build --release
        
    - name: Generate test metrics
      run: |
        # Create test metrics file for Phase 1 SLO validation
        cat > test_metrics.json << 'EOF'
        {
          "timestamp": "2025-01-16T12:00:00Z",
          "environment": "ci",
          "metrics": {
            "boot_to_interactive_time": {
              "value": 1800,
              "unit": "milliseconds",
              "percentile": "p95"
            },
            "hal_init_time": {
              "value": 180,
              "unit": "milliseconds", 
              "percentile": "p95"
            },
            "ipc_median_latency": {
              "value": 156,
              "unit": "microseconds",
              "percentile": "p50"
            },
            "ipc_p95_latency": {
              "value": 892,
              "unit": "microseconds",
              "percentile": "p95"
            },
            "ipc_throughput": {
              "value": 12847,
              "unit": "ops_per_second"
            },
            "rt_wake_to_run": {
              "value": 4200,
              "unit": "microseconds",
              "percentile": "p95"
            },
            "rt_scheduling_jitter": {
              "value": 800,
              "unit": "microseconds",
              "percentile": "p95"
            },
            "heap_allocation_time": {
              "value": 48,
              "unit": "microseconds",
              "percentile": "p95"
            },
            "page_fault_handling": {
              "value": 89,
              "unit": "microseconds",
              "percentile": "p95"
            },
            "memory_leak_bytes": {
              "value": 0,
              "unit": "bytes"
            }
          }
        }
        EOF
        
    - name: Validate Phase 1 SLO gates
      run: |
        echo "Validating Phase 1 SLO gates..."
        
        # Validate boot performance SLO
        ./perf/target/release/check_slo test_metrics.json phase1_boot_performance
        echo "✅ Boot performance SLO passed"
        
        # Validate IPC performance SLO  
        ./perf/target/release/check_slo test_metrics.json phase1_ipc_performance
        echo "✅ IPC performance SLO passed"
        
        # Validate real-time performance SLO
        ./perf/target/release/check_slo test_metrics.json phase1_realtime_performance
        echo "✅ Real-time performance SLO passed"
        
        # Validate memory performance SLO
        ./perf/target/release/check_slo test_metrics.json phase1_memory_performance
        echo "✅ Memory performance SLO passed"
        
        echo "🎉 All Phase 1 SLO gates passed!"

  # Security validation
  security-validation:
    name: Security Validation
    runs-on: ubuntu-22.04
    needs: spec-design-validation
    if: always() && (needs.spec-design-validation.result == 'success' || needs.spec-design-validation.result == 'skipped')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: nightly
        components: clippy
        
    - name: Run security-focused Clippy lints
      working-directory: kernel
      run: |
        cargo clippy --all-targets -- \
          -W clippy::integer_arithmetic \
          -W clippy::panic \
          -W clippy::unwrap_used \
          -W clippy::expect_used \
          -W clippy::mem_forget \
          -W clippy::mem_replace_with_uninit \
          -W clippy::cast_ptr_alignment \
          -W clippy::mut_from_ref \
          -D warnings
          
    - name: Check for unsafe code patterns
      working-directory: kernel
      run: |
        # Check for unsafe blocks and ensure they're documented
        UNSAFE_COUNT=$(grep -r "unsafe" src/ --include="*.rs" | wc -l || echo "0")
        echo "Found $UNSAFE_COUNT unsafe blocks"
        
        # Ensure all unsafe blocks have safety comments
        UNDOCUMENTED_UNSAFE=$(grep -B2 -A2 "unsafe" src/ --include="*.rs" | grep -v "// SAFETY:" | grep "unsafe" | wc -l || echo "0")
        if [ "$UNDOCUMENTED_UNSAFE" -gt 0 ]; then
          echo "❌ Found $UNDOCUMENTED_UNSAFE undocumented unsafe blocks"
          echo "All unsafe blocks must have preceding // SAFETY: comments"
          exit 1
        else
          echo "✅ All unsafe blocks are properly documented"
        fi
        
    - name: Validate capability integration
      run: |
        # Check that kernel integrates with Phase 0 capability system
        if grep -r "capability" kernel/src/ --include="*.rs" >/dev/null; then
          echo "✅ Capability system integration found"
        else
          echo "⚠️  Warning: No capability system integration detected"
        fi

  # Documentation validation
  documentation-validation:
    name: Documentation Validation
    runs-on: ubuntu-22.04
    needs: spec-design-validation
    if: always() && (needs.spec-design-validation.result == 'success' || needs.spec-design-validation.result == 'skipped')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Rust toolchain for doc generation
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: nightly
        
    - name: Generate and validate kernel documentation
      working-directory: kernel
      run: |
        # Generate documentation
        cargo doc --no-deps --document-private-items
        
        # Check for missing documentation
        cargo doc --no-deps --document-private-items 2>&1 | tee doc_warnings.txt
        
        if grep -q "warning.*missing documentation" doc_warnings.txt; then
          echo "❌ Found missing documentation warnings"
          cat doc_warnings.txt
          exit 1
        else
          echo "✅ All public APIs are documented"
        fi
        
    - name: Validate Phase 1 documentation completeness
      run: |
        echo "Checking Phase 1 documentation completeness..."
        
        # Check required documents exist
        REQUIRED_DOCS=(
          "docs/phase-1/SPEC.md"
          "docs/phase-1/DESIGN.md"
          "docs/phase-1/TASKS.md"
          "docs/phase-1/README.md"
        )
        
        for doc in "${REQUIRED_DOCS[@]}"; do
          if [ -f "$doc" ]; then
            echo "✅ $doc exists"
            
            # Check document is not empty
            if [ -s "$doc" ]; then
              echo "  ✅ $doc is not empty"
            else
              echo "  ❌ $doc is empty"
              exit 1
            fi
          else
            echo "❌ Required document missing: $doc"
            exit 1
          fi
        done
        
        echo "✅ All Phase 1 documentation is present and non-empty"

  # Final validation summary
  phase1-validation-summary:
    name: Phase 1 Validation Summary
    runs-on: ubuntu-22.04
    needs: [spec-design-validation, kernel-build, kernel-unit-tests, qemu-integration-tests, slo-gate-validation, security-validation, documentation-validation]
    if: always()
    
    steps:
    - name: Validation Results Summary
      run: |
        echo "# Phase 1 Validation Results"
        echo ""
        
        # Check results of each job
        declare -A job_results=(
          ["SPEC/DESIGN Delta"]="${{ needs.spec-design-validation.result }}"
          ["Kernel Build"]="${{ needs.kernel-build.result }}"
          ["Unit Tests"]="${{ needs.kernel-unit-tests.result }}"
          ["QEMU Integration"]="${{ needs.qemu-integration-tests.result }}"
          ["SLO Gate Validation"]="${{ needs.slo-gate-validation.result }}"
          ["Security Validation"]="${{ needs.security-validation.result }}"
          ["Documentation"]="${{ needs.documentation-validation.result }}"
        )
        
        all_passed=true
        for job in "${!job_results[@]}"; do
          result="${job_results[$job]}"
          case $result in
            "success")
              echo "✅ $job: PASSED"
              ;;
            "skipped")
              echo "⏸️  $job: SKIPPED"
              ;;
            "failure")
              echo "❌ $job: FAILED"
              all_passed=false
              ;;
            "cancelled")
              echo "🚫 $job: CANCELLED"
              all_passed=false
              ;;
            *)
              echo "❓ $job: UNKNOWN ($result)"
              all_passed=false
              ;;
          esac
        done
        
        echo ""
        if [ "$all_passed" = true ]; then
          echo "🎉 **ALL PHASE 1 VALIDATIONS PASSED!**"
          echo ""
          echo "This PR satisfies all Phase 1 requirements:"
          echo "- SPEC → DESIGN → TASKS → CODE/TESTS → DOCS pattern followed"
          echo "- Kernel builds successfully for all targets"
          echo "- Unit test coverage >90%"
          echo "- QEMU integration tests pass"
          echo "- SLO gates are satisfied"
          echo "- Security validation passed"
          echo "- Documentation is complete"
          echo ""
          echo "Ready for merge! 🚀"
        else
          echo "❌ **PHASE 1 VALIDATION FAILED**"
          echo ""
          echo "Some validation checks failed. Please review the failed jobs above"
          echo "and address any issues before merging."
          echo ""
          echo "For help, see: docs/phase-1/README.md#troubleshooting"
          exit 1
        fi
