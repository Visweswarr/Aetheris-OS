name: P4-07-A4 HAL Linux Backends

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'services/devices/src/hal/**'
      - 'c/libc_aetheris/devices_list.*'
      - 'go/tooling/devctl/devices.go'
      - 'tooling/ts/device_bridge.ts'
      - 'tooling/python/device_validator.py'
      - 'docs/phase-4/P4-07-A4-HAL-LINUX.md'
      - '.github/workflows/p4-07-hal.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'services/devices/src/hal/**'
      - 'c/libc_aetheris/devices_list.*'
      - 'go/tooling/devctl/devices.go'
      - 'tooling/ts/device_bridge.ts'
      - 'tooling/python/device_validator.py'
      - 'docs/phase-4/P4-07-A4-HAL-LINUX.md'
      - '.github/workflows/p4-07-hal.yml'
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_LOG: info

jobs:
  # Rust HAL Core Tests
  rust-hal-tests:
    name: Rust HAL Core Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust-version: ['1.70', '1.75', '1.80']
        target: ['x86_64-unknown-linux-gnu', 'aarch64-unknown-linux-gnu']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ matrix.rust-version }}
          target: ${{ matrix.target }}
          override: true
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgpiod-dev \
            libasound2-dev \
            libv4l-dev \
            pkg-config

      - name: Check Rust formatting
        run: |
          cd services/devices
          cargo fmt --all -- --check

      - name: Run Clippy
        run: |
          cd services/devices
          cargo clippy --all-targets --all-features -- -D warnings

      - name: Run unit tests
        run: |
          cd services/devices
          cargo test --lib

      - name: Run HAL-specific tests
        run: |
          cd services/devices
          cargo test hal::

      - name: Run integration tests
        run: |
          cd services/devices
          cargo test --test integration

      - name: Test deterministic provider
        run: |
          cd services/devices
          AETHERIS_DEV_PROVIDER=det cargo test --test hal_deterministic

      - name: Test Linux provider (if available)
        run: |
          cd services/devices
          AETHERIS_DEV_PROVIDER=linux cargo test --test hal_linux || echo "Linux provider not available on this system"

      - name: Generate test coverage
        run: |
          cd services/devices
          cargo install cargo-tarpaulin
          cargo tarpaulin --out Html --output-dir coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: services/devices/coverage/cobertura.xml
          flags: hal
          name: hal-coverage

  # C FFI Tests
  c-ffi-tests:
    name: C FFI Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc \
            g++ \
            cmake \
            pkg-config \
            libgpiod-dev \
            libasound2-dev \
            libv4l-dev

      - name: Build Rust library
        run: |
          cd services/devices
          cargo build --release

      - name: Compile C FFI
        run: |
          cd c/libc_aetheris
          gcc -c -fPIC devices_list.c -o devices_list.o
          gcc -shared -o libdevices_list.so devices_list.o -L../../services/devices/target/release -laetheris_devices

      - name: Create C test program
        run: |
          cat > test_devices_list.c << 'EOF'
          #include "devices_list.h"
          #include <stdio.h>
          #include <stdlib.h>
          
          int main() {
              aetheris_device_info_t* devices;
              size_t count;
              aetheris_device_list_error_t result = aetheris_discover_devices(&devices, &count);
              
              if (result == AETHERIS_DEVICE_LIST_SUCCESS) {
                  printf("Discovered %zu devices\n", count);
                  for (size_t i = 0; i < count; i++) {
                      printf("Device: %s (%s)\n", devices[i].device_id, devices[i].device_path);
                  }
                  aetheris_free_device_info_array(devices);
                  return 0;
              } else {
                  printf("Error: %s\n", aetheris_device_list_error_message(result));
                  return 1;
              }
          }
          EOF

      - name: Compile and run C test
        run: |
          cd c/libc_aetheris
          gcc -o test_devices_list test_devices_list.c -L. -ldevices_list -laetheris_devices
          LD_LIBRARY_PATH=.:../../services/devices/target/release ./test_devices_list

      - name: Test provider status
        run: |
          cd c/libc_aetheris
          cat > test_provider_status.c << 'EOF'
          #include "devices_list.h"
          #include <stdio.h>
          #include <stdlib.h>
          
          int main() {
              aetheris_provider_status_t* statuses;
              size_t count;
              aetheris_device_list_error_t result = aetheris_get_provider_status(&statuses, &count);
              
              if (result == AETHERIS_DEVICE_LIST_SUCCESS) {
                  printf("Found %zu providers\n", count);
                  for (size_t i = 0; i < count; i++) {
                      printf("Provider: %s, Available: %s, Devices: %zu\n",
                             aetheris_provider_type_to_string(statuses[i].provider_id),
                             statuses[i].is_available ? "Yes" : "No",
                             statuses[i].device_count);
                  }
                  aetheris_free_provider_status_array(statuses);
                  return 0;
              } else {
                  printf("Error: %s\n", aetheris_device_list_error_message(result));
                  return 1;
              }
          }
          EOF
          gcc -o test_provider_status test_provider_status.c -L. -ldevices_list -laetheris_devices
          LD_LIBRARY_PATH=.:../../services/devices/target/release ./test_provider_status

  # Go CLI Tests
  go-cli-tests:
    name: Go CLI Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.19', '1.20', '1.21']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ matrix.go-version }}

      - name: Cache Go modules
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ matrix.go-version }}-${{ hashFiles('**/go.sum') }}

      - name: Install Go dependencies
        run: |
          cd go/tooling/devctl
          go mod download

      - name: Run Go tests
        run: |
          cd go/tooling/devctl
          go test -v ./...

      - name: Build devctl
        run: |
          cd go/tooling/devctl
          go build -o devctl .

      - name: Test device listing
        run: |
          cd go/tooling/devctl
          ./devctl devices list --format json

      - name: Test provider status
        run: |
          cd go/tooling/devctl
          ./devctl devices provider status --format json

      - name: Test provider switching
        run: |
          cd go/tooling/devctl
          ./devctl devices provider set det
          ./devctl devices provider get

      - name: Test device filtering
        run: |
          cd go/tooling/devctl
          ./devctl devices list --type camera
          ./devctl devices list --provider det

      - name: Run Go linter
        run: |
          cd go/tooling/devctl
          go install golang.org/x/lint/golint@latest
          golint ./...

      - name: Check Go formatting
        run: |
          cd go/tooling/devctl
          go fmt ./...

  # TypeScript Bridge Tests
  ts-bridge-tests:
    name: TypeScript Bridge Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['18', '20', '21']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          cd tooling/ts
          npm install

      - name: Run TypeScript compiler
        run: |
          cd tooling/ts
          npx tsc --noEmit

      - name: Run ESLint
        run: |
          cd tooling/ts
          npx eslint device_bridge.ts

      - name: Run Prettier
        run: |
          cd tooling/ts
          npx prettier --check device_bridge.ts

      - name: Create TypeScript test
        run: |
          cd tooling/ts
          cat > test_device_bridge.ts << 'EOF'
          import { DeviceBridge, DeviceType, ProviderType } from './device_bridge';
          
          async function testDeviceBridge() {
              const bridge = new DeviceBridge();
              
              try {
                  // Test device discovery
                  const devices = await bridge.discoverDevices();
                  console.log(`Discovered ${devices.length} devices`);
                  
                  // Test filtering
                  const cameras = bridge.getDevicesByType(DeviceType.Camera);
                  console.log(`Found ${cameras.length} cameras`);
                  
                  // Test provider status
                  const statuses = await bridge.getProviderStatus();
                  console.log(`Found ${statuses.length} providers`);
                  
                  // Test provider switching
                  await bridge.setDefaultProvider(ProviderType.Deterministic);
                  const currentProvider = bridge.getDefaultProvider();
                  console.log(`Current provider: ${currentProvider}`);
                  
                  console.log('All tests passed!');
              } catch (error) {
                  console.error('Test failed:', error);
                  process.exit(1);
              } finally {
                  bridge.destroy();
              }
          }
          
          testDeviceBridge();
          EOF

      - name: Run TypeScript test
        run: |
          cd tooling/ts
          npx ts-node test_device_bridge.ts

  # Python Validator Tests
  python-validator-tests:
    name: Python Validator Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache Python dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements.txt') }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio black flake8 mypy

      - name: Run Black formatter
        run: |
          cd tooling/python
          black --check device_validator.py

      - name: Run Flake8 linter
        run: |
          cd tooling/python
          flake8 device_validator.py

      - name: Run MyPy type checker
        run: |
          cd tooling/python
          mypy device_validator.py

      - name: Run Python validator tests
        run: |
          cd tooling/python
          python device_validator.py --provider det --verbose

      - name: Test with Linux provider (if available)
        run: |
          cd tooling/python
          python device_validator.py --provider linux --verbose || echo "Linux provider not available"

      - name: Run performance tests
        run: |
          cd tooling/python
          python device_validator.py --provider det --output performance_results.json

  # Integration Tests
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [rust-hal-tests, c-ffi-tests, go-cli-tests, ts-bridge-tests, python-validator-tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc \
            g++ \
            cmake \
            pkg-config \
            libgpiod-dev \
            libasound2-dev \
            libv4l-dev \
            golang-go \
            nodejs \
            npm \
            python3 \
            python3-pip

      - name: Build Rust services
        run: |
          cd services/devices
          cargo build --release

      - name: Build C FFI
        run: |
          cd c/libc_aetheris
          gcc -c -fPIC devices_list.c -o devices_list.o
          gcc -shared -o libdevices_list.so devices_list.o -L../../services/devices/target/release -laetheris_devices

      - name: Build Go CLI
        run: |
          cd go/tooling/devctl
          go build -o devctl .

      - name: Install TypeScript dependencies
        run: |
          cd tooling/ts
          npm install

      - name: Install Python dependencies
        run: |
          pip install pytest pytest-asyncio

      - name: Run cross-language integration test
        run: |
          # Test Rust -> C FFI
          cd c/libc_aetheris
          LD_LIBRARY_PATH=.:../../services/devices/target/release ./test_devices_list
          
          # Test Go CLI
          cd ../../go/tooling/devctl
          ./devctl devices list --format json
          
          # Test TypeScript
          cd ../../tooling/ts
          npx ts-node test_device_bridge.ts
          
          # Test Python
          cd ../python
          python device_validator.py --provider det

      - name: Test provider switching
        run: |
          cd go/tooling/devctl
          ./devctl devices provider set det
          ./devctl devices provider get
          ./devctl devices provider set linux || echo "Linux provider not available"

      - name: Test device filtering
        run: |
          cd go/tooling/devctl
          ./devctl devices list --type camera
          ./devctl devices list --provider det
          ./devctl devices list --show-unavailable

  # Hardware Tests (Optional)
  hardware-tests:
    name: Hardware Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || contains(github.event.head_commit.message, '[hardware]')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install hardware dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc \
            g++ \
            cmake \
            pkg-config \
            libgpiod-dev \
            libasound2-dev \
            libv4l-dev \
            v4l-utils \
            alsa-utils \
            iio-utils

      - name: Check hardware availability
        run: |
          echo "Checking for hardware devices..."
          ls -la /dev/video* || echo "No video devices"
          ls -la /dev/gpiochip* || echo "No GPIO chips"
          ls -la /dev/snd/ || echo "No audio devices"
          ls -la /sys/bus/iio/devices/ || echo "No IIO devices"
          ls -la /sys/class/pwm/ || echo "No PWM devices"
          ls -la /sys/class/leds/ || echo "No LED devices"

      - name: Build with hardware support
        run: |
          cd services/devices
          AETHERIS_DEV_PROVIDER=linux cargo build --release

      - name: Test hardware discovery
        run: |
          cd services/devices
          AETHERIS_DEV_PROVIDER=linux cargo test --test hal_linux || echo "Hardware tests skipped"

      - name: Test hardware CLI
        run: |
          cd go/tooling/devctl
          go build -o devctl .
          AETHERIS_DEV_PROVIDER=linux ./devctl devices list --provider linux || echo "Hardware CLI tests skipped"

  # Performance Benchmarks
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || contains(github.event.head_commit.message, '[perf]')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc \
            g++ \
            cmake \
            pkg-config \
            libgpiod-dev \
            libasound2-dev \
            libv4l-dev

      - name: Build for performance testing
        run: |
          cd services/devices
          cargo build --release

      - name: Run performance benchmarks
        run: |
          cd services/devices
          cargo bench --bench hal_performance || echo "Performance benchmarks not available"

      - name: Test device discovery performance
        run: |
          cd go/tooling/devctl
          go build -o devctl .
          time ./devctl devices list
          time ./devctl devices provider status

      - name: Test Python validator performance
        run: |
          cd tooling/python
          time python device_validator.py --provider det

  # Documentation Tests
  docs-tests:
    name: Documentation Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install documentation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            markdownlint \
            pandoc

      - name: Check markdown formatting
        run: |
          markdownlint docs/phase-4/P4-07-A4-HAL-LINUX.md

      - name: Validate documentation links
        run: |
          # Check for broken links in documentation
          grep -r "https://" docs/phase-4/P4-07-A4-HAL-LINUX.md | while read line; do
            url=$(echo "$line" | grep -o 'https://[^)]*')
            if ! curl -s --head "$url" | head -n 1 | grep -q "200 OK"; then
              echo "Broken link: $url"
              exit 1
            fi
          done || echo "Link validation skipped"

      - name: Check code examples
        run: |
          # Extract and validate code examples
          grep -A 10 "```rust" docs/phase-4/P4-07-A4-HAL-LINUX.md | head -20
          grep -A 10 "```bash" docs/phase-4/P4-07-A4-HAL-LINUX.md | head -20

  # Security Tests
  security-tests:
    name: Security Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install security tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cargo-audit \
            bandit

      - name: Run Rust security audit
        run: |
          cd services/devices
          cargo install cargo-audit
          cargo audit

      - name: Run Python security scan
        run: |
          cd tooling/python
          bandit -r device_validator.py

      - name: Check for hardcoded secrets
        run: |
          # Check for potential secrets in code
          grep -r "password\|secret\|key\|token" services/devices/src/hal/ || echo "No hardcoded secrets found"
          grep -r "password\|secret\|key\|token" c/libc_aetheris/ || echo "No hardcoded secrets found"
          grep -r "password\|secret\|key\|token" go/tooling/devctl/ || echo "No hardcoded secrets found"

  # Summary
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [rust-hal-tests, c-ffi-tests, go-cli-tests, ts-bridge-tests, python-validator-tests, integration-tests]
    if: always()
    steps:
      - name: Generate test summary
        run: |
          echo "## HAL Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Rust HAL Core | ${{ needs.rust-hal-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| C FFI | ${{ needs.c-ffi-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Go CLI | ${{ needs.go-cli-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| TypeScript Bridge | ${{ needs.ts-bridge-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Python Validator | ${{ needs.python-validator-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration Tests | ${{ needs.integration-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${{ needs.rust-hal-tests.result }}" == "success" && 
                "${{ needs.c-ffi-tests.result }}" == "success" && 
                "${{ needs.go-cli-tests.result }}" == "success" && 
                "${{ needs.ts-bridge-tests.result }}" == "success" && 
                "${{ needs.python-validator-tests.result }}" == "success" && 
                "${{ needs.integration-tests.result }}" == "success" ]]; then
            echo "✅ All HAL tests passed!" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Some HAL tests failed!" >> $GITHUB_STEP_SUMMARY
          fi
