name: Phase 4 - XR & Device Runtime

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_hw_tests:
        description: 'Skip hardware-dependent tests'
        required: false
        default: false
        type: boolean

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  AETHERIS_DETERMINISTIC: true
  AETHERIS_SEED: 42

jobs:
  bootstrap:
    name: 🔧 Bootstrap
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Rust toolchain
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-rust-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-

      - name: Cache Go modules
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Cache Node modules
        uses: actions/cache@v3
        with:
          path: |
            node_modules
            tooling/ts/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Cache Python packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/pip
            ~/.local/lib/python*/site-packages
          key: ${{ runner.os }}-python-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-python-

      - name: Bootstrap (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x scripts/bootstrap-linux.sh
          bash scripts/bootstrap-linux.sh

      - name: Bootstrap (Windows)
        if: runner.os == 'Windows'
        run: |
          pwsh -ExecutionPolicy Bypass -File scripts/bootstrap-windows.ps1

      - name: Run Makefile bootstrap
        run: make bootstrap

  format-lint:
    name: 🎨 Format & Lint
    runs-on: ${{ matrix.os }}
    needs: bootstrap
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Restore caches
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
            ~/.cache/go-build
            ~/go/pkg/mod
            node_modules
            tooling/ts/node_modules
            ~/.cache/pip
            ~/.local/lib/python*/site-packages
          key: ${{ runner.os }}-rust-${{ hashFiles('**/Cargo.lock') }}

      - name: Format code
        run: make fmt

      - name: Lint code
        run: make lint

      - name: Check formatting
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            cargo fmt --all -- --check
            find go/tooling -name "*.go" -exec gofmt -d {} \; | grep -q . && exit 1 || true
          fi

  test-core:
    name: 🧪 Test Core
    runs-on: ${{ matrix.os }}
    needs: bootstrap
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Restore caches
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
            ~/.cache/go-build
            ~/go/pkg/mod
            node_modules
            tooling/ts/node_modules
            ~/.cache/pip
            ~/.local/lib/python*/site-packages
          key: ${{ runner.os }}-rust-${{ hashFiles('**/Cargo.lock') }}

      - name: Run core tests
        run: make test

      - name: Run Rust tests
        run: cargo test --workspace --exclude aetheris-hw

      - name: Run Go tests
        run: |
          cd go/tooling
          go test ./...

      - name: Run TypeScript tests
        run: |
          cd tooling/ts
          if [ -f package.json ]; then
            npm test
          fi

      - name: Run Python tests
        run: |
          cd tooling/python
          python3 -m pytest -m "not hw" -v

  test-hw:
    name: 🔌 Test Hardware
    runs-on: ubuntu-latest
    needs: bootstrap
    if: github.event.inputs.skip_hw_tests != 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Restore caches
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
            ~/.cache/go-build
            ~/go/pkg/mod
            node_modules
            tooling/ts/node_modules
            ~/.cache/pip
            ~/.local/lib/python*/site-packages
          key: ${{ runner.os }}-rust-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup mock hardware
        run: |
          # Create mock devices for testing
          sudo mkdir -p /dev
          sudo mknod /dev/video0 c 81 0 2>/dev/null || true
          sudo mknod /dev/gpiochip0 c 254 0 2>/dev/null || true
          sudo chmod 666 /dev/video0 /dev/gpiochip0 2>/dev/null || true

      - name: Run hardware tests
        run: |
          # Run hardware-dependent tests with mock devices
          export AETHERIS_DEVICE_PROVIDER=deterministic
          export AETHERIS_DEVICE_MOCK=true
          make test

      - name: Run HAL smoke test
        run: |
          if [ -f scripts/hal_smoke.sh ]; then
            chmod +x scripts/hal_smoke.sh
            bash scripts/hal_smoke.sh
          fi

  docs:
    name: 📚 Docs
    runs-on: ubuntu-latest
    needs: bootstrap
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Restore caches
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
            ~/.cache/go-build
            ~/go/pkg/mod
            node_modules
            tooling/ts/node_modules
            ~/.cache/pip
            ~/.local/lib/python*/site-packages
          key: ${{ runner.os }}-rust-${{ hashFiles('**/Cargo.lock') }}

      - name: Validate documentation
        run: make docs

      - name: Check markdown links
        run: |
          if command -v markdown-link-check >/dev/null 2>&1; then
            find docs -name "*.md" -exec markdown-link-check {} \;
          else
            echo "markdown-link-check not available, skipping link validation"
          fi

      - name: Validate documentation structure
        run: |
          # Check for required documentation files
          test -f docs/phase-4/PHASE-4-OVERVIEW.md
          test -f docs/phase-4/RUNBOOKS.md
          test -f docs/phase-4/P4-07-A5-EDGE-AI.md
          echo "✅ Documentation structure validated"

  package:
    name: 📦 Package
    runs-on: ${{ matrix.os }}
    needs: [bootstrap, test-core]
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Restore caches
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
            ~/.cache/go-build
            ~/go/pkg/mod
            node_modules
            tooling/ts/node_modules
            ~/.cache/pip
            ~/.local/lib/python*/site-packages
          key: ${{ runner.os }}-rust-${{ hashFiles('**/Cargo.lock') }}

      - name: Package artifacts
        run: make package

      - name: Generate SBOM
        run: make sbom

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ runner.os }}
          path: |
            artifacts/
            target/release/
          retention-days: 30

  determinism-check:
    name: 🔄 Determinism
    runs-on: ubuntu-latest
    needs: [bootstrap, test-core]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Restore caches
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
            ~/.cache/go-build
            ~/go/pkg/mod
            node_modules
            tooling/ts/node_modules
            ~/.cache/pip
            ~/.local/lib/python*/site-packages
          key: ${{ runner.os }}-rust-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup deterministic environment
        run: |
          export AETHERIS_DETERMINISTIC=true
          export AETHERIS_SEED=42
          export AETHERIS_DEVICE_PROVIDER=deterministic
          export AETHERIS_DEVICE_MOCK=true

      - name: XR Determinism Test
        run: |
          # Create test artifacts directory
          mkdir -p artifacts/determinism-test
          
          # Run XR snapshot save/load test 3 times
          for i in {1..3}; do
            echo "Running XR determinism test iteration $i"
            
            # Create test scene
            xrctl session start --room "determinism-test-$i" --device /dev/video0 || true
            
            # Spawn test objects
            xrctl scene spawn --room "determinism-test-$i" --mesh cube --pos 0,1,0 || true
            xrctl scene spawn --room "determinism-test-$i" --mesh sphere --pos 1,1,1 || true
            
            # Save snapshot
            xrctl persist save --room "determinism-test-$i" --output "artifacts/determinism-test/snapshot-$i.cbor" || true
            
            # Load snapshot
            xrctl persist load --input "artifacts/determinism-test/snapshot-$i.cbor" --room "determinism-test-$i-loaded" || true
            
            # Save loaded snapshot
            xrctl persist save --room "determinism-test-$i-loaded" --output "artifacts/determinism-test/snapshot-$i-loaded.cbor" || true
          done
          
          # Compare snapshots (should be identical)
          echo "Comparing XR snapshots..."
          for i in {1..3}; do
            if [ -f "artifacts/determinism-test/snapshot-$i.cbor" ] && [ -f "artifacts/determinism-test/snapshot-$i-loaded.cbor" ]; then
              if cmp "artifacts/determinism-test/snapshot-$i.cbor" "artifacts/determinism-test/snapshot-$i-loaded.cbor"; then
                echo "✅ XR snapshot $i is deterministic"
              else
                echo "❌ XR snapshot $i is not deterministic"
                exit 1
              fi
            fi
          done

      - name: AI Determinism Test
        run: |
          # Run AI determinism test
          cd tooling/python
          python3 ai_validator.py --test determinism --iterations 3 --seed 42
          
          # Verify AI determinism
          if [ $? -eq 0 ]; then
            echo "✅ AI determinism test passed"
          else
            echo "❌ AI determinism test failed"
            exit 1
          fi

      - name: Combined Determinism Test
        run: |
          # Test combined XR + AI determinism
          export AETHERIS_DETERMINISTIC=true
          export AETHERIS_SEED=42
          
          # Create combined test
          mkdir -p artifacts/combined-test
          
          # Run combined test 3 times
          for i in {1..3}; do
            echo "Running combined determinism test iteration $i"
            
            # Start XR session
            xrctl session start --room "combined-test-$i" --device /dev/video0 || true
            
            # Spawn object
            xrctl scene spawn --room "combined-test-$i" --mesh cube --pos 0,1,0 || true
            
            # Start AI vision
            devctl ai vision start --device /dev/video0 --model yolo_n --fps 15 --seed 42 || true
            
            # Process frame
            devctl ai vision process --session vision_$i --input test-frame.jpg --output "artifacts/combined-test/detections-$i.json" || true
            
            # Save combined state
            xrctl persist save --room "combined-test-$i" --output "artifacts/combined-test/combined-$i.cbor" || true
          done
          
          # Compare combined results
          echo "Comparing combined test results..."
          for i in {1..3}; do
            if [ -f "artifacts/combined-test/detections-$i.json" ]; then
              echo "✅ Combined test $i completed"
            fi
          done

      - name: Upload determinism artifacts
        uses: actions/upload-artifact@v4
        with:
          name: determinism-artifacts
          path: |
            artifacts/determinism-test/
            artifacts/combined-test/
          retention-days: 30

  security:
    name: 🔒 Security
    runs-on: ubuntu-latest
    needs: bootstrap
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Restore caches
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
            ~/.cache/go-build
            ~/go/pkg/mod
            node_modules
            tooling/ts/node_modules
            ~/.cache/pip
            ~/.local/lib/python*/site-packages
          key: ${{ runner.os }}-rust-${{ hashFiles('**/Cargo.lock') }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run CodeQL Analysis
        uses: github/codeql-action/analyze@v2

  performance:
    name: ⚡ Performance
    runs-on: ubuntu-latest
    needs: [bootstrap, test-core]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Restore caches
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
            ~/.cache/go-build
            ~/go/pkg/mod
            node_modules
            tooling/ts/node_modules
            ~/.cache/pip
            ~/.local/lib/python*/site-packages
          key: ${{ runner.os }}-rust-${{ hashFiles('**/Cargo.lock') }}

      - name: Run performance benchmarks
        run: |
          # Set up performance testing environment
          export AETHERIS_DETERMINISTIC=true
          export AETHERIS_SEED=42
          export AETHERIS_DEVICE_PROVIDER=deterministic
          export AETHERIS_DEVICE_MOCK=true
          
          # Run performance tests
          cargo test --workspace --release -- --nocapture performance
          
          # Run XR performance tests
          xrctl benchmark --iterations 100 --output artifacts/performance/xr-benchmark.json || true
          
          # Run AI performance tests
          devctl ai benchmark --iterations 50 --output artifacts/performance/ai-benchmark.json || true

      - name: Upload performance results
        uses: actions/upload-artifact@v4
        with:
          name: performance-results
          path: |
            artifacts/performance/
          retention-days: 30

  summary:
    name: 📊 Summary
    runs-on: ubuntu-latest
    needs: [bootstrap, format-lint, test-core, test-hw, docs, package, determinism-check, security, performance]
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate summary
        run: |
          echo "## Phase 4 CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔧 Bootstrap | ${{ needs.bootstrap.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🎨 Format & Lint | ${{ needs.format-lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🧪 Test Core | ${{ needs.test-core.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔌 Test Hardware | ${{ needs.test-hw.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📚 Docs | ${{ needs.docs.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📦 Package | ${{ needs.package.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔄 Determinism | ${{ needs.determinism-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔒 Security | ${{ needs.security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ⚡ Performance | ${{ needs.performance.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts Generated" >> $GITHUB_STEP_SUMMARY
          echo "- 📦 Package artifacts (binaries)" >> $GITHUB_STEP_SUMMARY
          echo "- 🔍 SBOM (Software Bill of Materials)" >> $GITHUB_STEP_SUMMARY
          echo "- 📸 Snapshots (deterministic test data)" >> $GITHUB_STEP_SUMMARY
          echo "- 📋 Logs (test execution logs)" >> $GITHUB_STEP_SUMMARY
          echo "- ⚡ Performance benchmarks" >> $GITHUB_STEP_SUMMARY
