# Phase 1 Documentation Guard
# Enforces SPEC → DESIGN → TASKS → CODE/TESTS → DOCS pattern
# Rejects PRs that change kernel/ without updating Phase 1 documentation

name: Phase 1 Documentation Guard

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'kernel/**'
      - 'docs/phase-1/**'

permissions:
  contents: read
  pull-requests: read

jobs:
  phase-1-docs-guard:
    name: Enforce Phase 1 Documentation Rule
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Need full history for file change detection
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'tooling/ci/package.json'
        
    - name: Install dependencies
      working-directory: tooling/ci
      run: |
        if [ -f package.json ]; then
          npm ci
        else
          # Create minimal package.json if it doesn't exist
          cat > package.json << 'EOF'
        {
          "name": "@polymera/ci-tools",
          "version": "1.0.0",
          "description": "CI/CD validation tools for Polymera OS",
          "main": "index.js",
          "scripts": {
            "check-phase-docs": "node check_phase_docs.ts"
          },
          "devDependencies": {
            "@types/node": "^20.0.0",
            "typescript": "^5.0.0",
            "tsx": "^4.0.0"
          }
        }
        EOF
          npm install
        fi
        
    - name: Run Phase 1 documentation check
      working-directory: tooling/ci
      run: |
        # Use tsx to run TypeScript directly, or compile if tsx not available
        if npm list tsx > /dev/null 2>&1; then
          npx tsx check_phase_docs.ts
        else
          # Fallback: compile TypeScript first
          npx tsc check_phase_docs.ts --target es2020 --module commonjs --outDir dist
          node dist/check_phase_docs.js
        fi
      env:
        # Pass GitHub context to the script
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        REPOSITORY: ${{ github.repository }}
        
    - name: Report results
      if: always()
      run: |
        if [ $? -eq 0 ]; then
          echo "✅ Phase 1 documentation rule satisfied"
          echo "::notice title=Phase 1 Guard::Documentation requirements met"
        else
          echo "❌ Phase 1 documentation rule violated"
          echo "::error title=Phase 1 Guard::Kernel changes require SPEC.md or DESIGN.md updates"
        fi
