name: PR Title Check

on:
  pull_request:
    types: [opened, edited, synchronize]

jobs:
  pr-title-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR Title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Enforce conventional commit format
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          # Allowed scopes
          scopes: |
            xr
            device
            ai
            hal
            contracts
            relay
            ngfs
            dao
            captoken
            security
            perf
            docs
            ci
            release
          # Allow breaking changes
          requireScope: false
          # Custom validation
          subjectPattern: ^.{1,100}$
          subjectPatternError: |
            The subject "{subject}" found in the pull request title "{title}" didn't match the configured pattern. Please ensure that the subject is between 1 and 100 characters.
          # Disable WIP and draft checks
          wip: false
