[package]
name = "polymera-pack"
version = "0.1.0"
edition = "2021"
description = "Content-addressed package format for Polymera OS"
license = "MIT OR Apache-2.0"
repository = "https://github.com/polymera-os/polymera-os"
keywords = ["package", "sbom", "security", "capabilities", "content-addressed"]
categories = ["development-tools", "security"]

[dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Cryptography
sha2 = "0.10"
base64 = "0.21"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "1.0"

# File system operations
walkdir = "2.4"

# Regular expressions
regex = "1.0"

# Async runtime
tokio = { version = "1.0", features = ["full"] }

[dev-dependencies]
tempfile = "3.8"
tokio-test = "0.4"

[[bin]]
name = "polymera-pack"
path = "src/bin/main.rs"

[[bin]]
name = "pack-test"
path = "src/bin/test.rs"
