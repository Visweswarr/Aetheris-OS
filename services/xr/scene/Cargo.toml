[package]
name = "polymera-xr-scene"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_cbor = "0.11"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
blake3 = "1.5"
anyhow = "1"
thiserror = "1"
async-trait = "0.1"
tonic = "0.10"
prost = "0.12"
tracing = "0.1"
tracing-subscriber = "0.3"
futures = "0.3"
dashmap = "5.5"
parking_lot = "0.12"
crossbeam-channel = "0.5"

# Internal Polymera OS crates
polymera-crypto = { path = "../../../polymera-crypto" }
ngfs = { path = "../../../ngfs" }
cap-tokens = { path = "../../../cap-tokens" }
intent-kernel = { path = "../../../intent-kernel" }
polymera-did = { path = "../../identity" }
polymera-dao = { path = "../../dao" }

[build-dependencies]
prost-build = "0.12"
