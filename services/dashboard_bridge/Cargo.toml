[package]
name = "dashboard-bridge"
version = "0.1.0"
edition = "2021"
description = "Bridges kernel metrics to the dashboard UI"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }

[dev-dependencies]
tempfile = "3.0"

