[package]
name = "polymera-identity"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# Core dependencies
tokio = { version = "1.0", features = ["full"] }
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

# Post-quantum cryptography
dilithium = "0.3"
kyber = "0.1"
ed25519-dalek = "2.0"
sha2 = "0.10"
sha3 = "0.10"
rand = "0.8"

# DID and identity standards
did_parser = "0.3"
did_resolver = "0.1"
did_doc = "0.1"

# Storage and database
sled = "0.34"
dashmap = "5.4"

# Utilities
anyhow = "1.0"
clap = { version = "4.0", features = ["derive"] }
config = "0.13"
dirs = "5.0"
base64 = "0.21"
hex = "0.4"

[dev-dependencies]
tokio-test = "0.4"
criterion = "0.5"
tempfile = "3.0"

[[bench]]
name = "identity_benchmarks"
harness = false
