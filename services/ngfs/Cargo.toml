[package]
name = "ngfs"
version = "0.1.0"
edition = "2021"
authors = ["Polymera OS Team"]
description = "NGFS v1 - Content-Addressed Filesystem with DID-Bound Encryption"
license = "MIT OR Apache-2.0"
repository = "https://github.com/polymera-os/polymera-os"
keywords = ["filesystem", "content-addressed", "encryption", "did", "ipfs"]
categories = ["filesystems", "cryptography"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_cbor = "0.11"
blake3 = "1.5"
hex = "0.4"
zeroize = { version = "1.7", features = ["derive"] }
thiserror = "1.0"
rand = "0.8"
bs58 = "0.5"

[dev-dependencies]
tempfile = "3.8"

[features]
default = []
test-utils = []
