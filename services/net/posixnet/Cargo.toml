[package]
name = "posixnet"
version = "0.1.0"
edition = "2021"
authors = ["Aetheris OS Team"]
description = "POSIX Networking Broker for Aetheris OS"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
async-trait = "0.1"
futures = "0.3"
bytes = "1.0"
uuid = { version = "1.0", features = ["v4"] }
dashmap = "5.0"
parking_lot = "0.12"
once_cell = "1.0"
regex = "1.0"
cidr-utils = "0.6"
dns-lookup = "2.0"
libc = "0.2"
nix = { version = "0.27", features = ["socket", "net"] }

# Policy engine
wasmtime = "12.0"
regorus = "0.1"

# TLS support
rustls = "0.21"
rustls-pemfile = "1.0"
webpki = "0.22"
webpki-roots = "0.23"

# PQC integration
polymera-crypto = { path = "../../../crypto" }

# Zero-copy I/O
bytes = "1.0"

# Error handling
thiserror = "1.0"

# QUIC support
quinn = "0.10"
quinn-proto = "0.10"

# libp2p integration
libp2p = { version = "0.53", features = ["quic", "tcp", "yamux", "mplex", "noise", "identify", "ping", "kad", "gossipsub"] }
libp2p-quic = "0.3"
libp2p-noise = "0.43"
libp2p-yamux = "0.45"
libp2p-mplex = "0.12"
libp2p-identify = "0.2"
libp2p-ping = "0.2"
libp2p-kad = "0.22"
libp2p-gossipsub = "0.45"

# Capability system integration
aetheris-cap = { path = "../../../crates/aetheris-cap" }
aetheris-policy = { path = "../../policy" }

[dev-dependencies]
tokio-test = "0.4"
criterion = "0.5"

[[bench]]
name = "socket_performance"
harness = false
