[package]
name = "quic"
version = "0.1.0"
edition = "2021"
authors = ["Aetheris OS Team"]
description = "QUIC/HTTP3 Service for Aetheris OS"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
quinn = "0.10"
quinn-proto = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
async-trait = "0.1"
futures = "0.3"
bytes = "1.0"
uuid = { version = "1.0", features = ["v4"] }
dashmap = "5.0"
parking_lot = "0.12"
once_cell = "1.0"
rustls = "0.21"
rustls-pemfile = "1.0"
webpki = "0.22"
webpki-roots = "0.23"
http = "0.2"
http-body = "0.4"
hyper = { version = "0.14", features = ["full"] }
hyper-util = "0.1"
h3 = "0.1"
h3-quinn = "0.1"

# Capability system integration
aetheris-cap = { path = "../../../crates/aetheris-cap" }
aetheris-policy = { path = "../../policy" }

[dev-dependencies]
tokio-test = "0.4"
criterion = "0.5"

[[bench]]
name = "quic_performance"
harness = false
