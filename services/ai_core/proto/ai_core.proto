syntax = "proto3";

package aetheris.ai_core;

// Core message types for AI Core Service IPC
message AiCoreMessage {
  oneof message_type {
    PingRequest ping_request = 1;
    PingResponse ping_response = 2;
    ChatRequest chat_request = 3;
    ChatResponse chat_response = 4;
    ToolCallRequest tool_call_request = 5;
    ToolCallResponse tool_call_response = 6;
    FunctionResult function_result = 7;
    ErrorEnvelope error_envelope = 8;
    // Legacy error response for backwards compatibility
    ErrorResponse error_response = 9;
    NotificationActionRequest notification_action_request = 21;
    NotificationActionResponse notification_action_response = 22;
    PlanRequest plan_request = 23;
    PlanResponse plan_response = 24;
    PlanStatusRequest plan_status_request = 25;
    PlanStatusResponse plan_status_response = 26;
    PlanListRequest plan_list_request = 27;
    PlanListResponse plan_list_response = 28;
    FusionRequest fusion_request = 29;
    FusionResponse fusion_response = 30;
    TaskGraphRequest task_graph_request = 31;
    TaskGraphResponse task_graph_response = 32;
    ModelLoadRequest model_load_request = 33;
    ModelLoadResponse model_load_response = 34;
    PrivacyClassifyRequest privacy_classify_request = 35;
    PrivacyClassifyResponse privacy_classify_response = 36;
    BudgetReserveRequest budget_reserve_request = 37;
    BudgetReserveResponse budget_reserve_response = 38;
    ReplayCompareRequest replay_compare_request = 39;
    ReplayCompareResponse replay_compare_response = 40;
  }
  
  // Message metadata
  string message_id = 10;
  int64 timestamp = 11;
  string session_id = 12;
  CapToken cap_token = 13;
  
  // Reserved fields for backwards compatibility
  reserved 14 to 20;
}

// Capability token for authorization
message CapToken {
  string token_id = 1;
  string capability = 2;
  int64 expires_at = 3;
  bytes signature = 4;
  string issuer = 5;
}

// Ping request/response for health checks
message PingRequest {
  string client_id = 1;
  string version = 2;
}

message PingResponse {
  string server_id = 1;
  string version = 2;
  int64 server_time = 3;
  ServiceStatus status = 4;
}

// Chat request/response for LLM interactions
message ChatRequest {
  string prompt = 1;
  ChatConfig config = 2;
  repeated MessageContext context = 3;
  bool stream = 4;
  
  // Enhanced fields for structured communication
  string conversation_id = 5;
  string user_id = 6;
  map<string, string> metadata = 7;
  repeated string attachments = 8; // File paths or URLs
  string language = 9;
  bool enable_function_calling = 10;
  repeated string allowed_functions = 11;
  
  // Reserved fields for backwards compatibility
  reserved 12 to 20;
}

message ChatResponse {
  string response = 1;
  bool is_complete = 2;
  ChatMetrics metrics = 3;
  repeated ToolCall tool_calls = 4;
  
  // Enhanced fields for structured communication
  string conversation_id = 5;
  string response_id = 6;
  repeated FunctionResult function_results = 7;
  map<string, string> metadata = 8;
  string model_version = 9;
  int32 usage_tokens = 10;
  float confidence_score = 11;
  repeated string citations = 12;
  
  // Reserved fields for backwards compatibility
  reserved 13 to 20;
}

// Tool call request/response for function calling
message ToolCallRequest {
  string tool_name = 1;
  map<string, string> parameters = 2;
  string context = 3;
  
  // Enhanced fields for structured tool IO
  bytes cbor_payload = 4; // CBOR-encoded structured data
  string call_id = 5;
  string session_id = 6;
  map<string, string> metadata = 7;
  int32 timeout_seconds = 8;
  bool async = 9;
  
  // Reserved fields for backwards compatibility
  reserved 10 to 20;
}

message ToolCallResponse {
  string result = 1;
  bool success = 2;
  string error_message = 3;
  ToolMetrics metrics = 4;
  
  // Enhanced fields for structured tool IO
  bytes cbor_payload = 5; // CBOR-encoded structured result
  string call_id = 6;
  string tool_version = 7;
  map<string, string> metadata = 8;
  repeated string warnings = 9;
  int32 exit_code = 10;
  
  // Reserved fields for backwards compatibility
  reserved 11 to 20;
}

// Function result for structured function calling
message FunctionResult {
  string function_name = 1;
  string call_id = 2;
  bool success = 3;
  string result = 4;
  bytes cbor_payload = 5; // CBOR-encoded structured result
  string error_message = 6;
  int32 exit_code = 7;
  map<string, string> metadata = 8;
  int64 execution_time_ms = 9;
  int32 memory_used_mb = 10;
  
  // Reserved fields for backwards compatibility
  reserved 11 to 20;
}

// Enhanced error envelope for comprehensive error handling
message ErrorEnvelope {
  ErrorCode code = 1;
  string message = 2;
  string details = 3;
  int64 timestamp = 4;
  
  // Enhanced error information
  string error_id = 5;
  string component = 6; // Which component generated the error
  string operation = 7; // What operation was being performed
  map<string, string> context = 8; // Additional context
  repeated string stack_trace = 9; // Stack trace if available
  string suggestion = 10; // Suggested remediation
  bool retryable = 11; // Whether the operation can be retried
  int32 retry_after_seconds = 12; // Suggested retry delay
  
  // Reserved fields for backwards compatibility
  reserved 13 to 20;
}

// Error response for error handling
message ErrorResponse {
  ErrorCode code = 1;
  string message = 2;
  string details = 3;
  int64 timestamp = 4;
}

// Configuration and context types
message ChatConfig {
  string model = 1;
  float temperature = 2;
  int32 max_tokens = 3;
  float top_p = 4;
  int32 top_k = 5;
  bool enable_tools = 6;
  repeated string allowed_tools = 7;
}

message MessageContext {
  string role = 1;
  string content = 2;
  int64 timestamp = 3;
  map<string, string> metadata = 4;
}

message ToolCall {
  string tool_name = 1;
  map<string, string> parameters = 2;
  string call_id = 3;
  
  // Enhanced fields for structured function calling
  bytes cbor_payload = 4; // CBOR-encoded structured parameters
  string function_name = 5; // Specific function within the tool
  map<string, string> metadata = 6;
  int32 timeout_seconds = 7;
  bool async = 8;
  
  // Reserved fields for backwards compatibility
  reserved 9 to 20;
}

// Metrics and status types
message ChatMetrics {
  int64 processing_time_ms = 1;
  int32 tokens_generated = 2;
  int32 tokens_input = 3;
  float confidence = 4;
  string model_used = 5;
}

message ToolMetrics {
  int64 execution_time_ms = 1;
  int32 memory_used_mb = 2;
  bool cache_hit = 3;
  string tool_version = 4;
}

message ServiceStatus {
  ServiceState state = 1;
  int32 active_sessions = 2;
  int64 uptime_seconds = 3;
  SystemMetrics system_metrics = 4;
}

message SystemMetrics {
  float cpu_usage_percent = 1;
  int64 memory_used_mb = 2;
  int64 memory_total_mb = 3;
  int32 active_connections = 4;
  int64 requests_processed = 5;
}

// Enums
enum ErrorCode {
  UNKNOWN_ERROR = 0;
  INVALID_REQUEST = 1;
  UNAUTHORIZED = 2;
  CAPABILITY_DENIED = 3;
  MODEL_NOT_AVAILABLE = 4;
  TOOL_NOT_FOUND = 5;
  TOOL_EXECUTION_FAILED = 6;
  RATE_LIMITED = 7;
  INTERNAL_ERROR = 8;
  TIMEOUT = 9;
  
  // Enhanced error codes for comprehensive error handling
  VALIDATION_ERROR = 10;
  NOT_FOUND = 11;
  ALREADY_EXISTS = 12;
  INVALID_ARGUMENT = 13;
  UNSUPPORTED_OPERATION = 14;
  SERVICE_UNAVAILABLE = 15;
  EXTERNAL_SERVICE_ERROR = 16;
  NETWORK_ERROR = 17;
  SERIALIZATION_ERROR = 18;
  DESERIALIZATION_ERROR = 19;
  CONFIGURATION_ERROR = 20;
  RESOURCE_EXHAUSTED = 21;
  CONCURRENT_MODIFICATION = 22;
  DEPENDENCY_FAILURE = 23;
  AUTHENTICATION_FAILED = 24;
  AUTHORIZATION_FAILED = 25;
  TOKEN_EXPIRED = 26;
  TOKEN_INVALID = 27;
  SESSION_EXPIRED = 28;
  SESSION_INVALID = 29;
  QUOTA_EXCEEDED = 30;
  BANDWIDTH_EXCEEDED = 31;
  STORAGE_FULL = 32;
  FILE_NOT_FOUND = 33;
  PERMISSION_DENIED = 34;
  INVALID_FORMAT = 35;
  CORRUPTED_DATA = 36;
  VERSION_MISMATCH = 37;
  FEATURE_NOT_AVAILABLE = 38;
  MAINTENANCE_MODE = 39;
  UPGRADE_REQUIRED = 40;
  
  // Reserved for future use
  reserved 41 to 100;
}

enum ServiceState {
  STARTING = 0;
  RUNNING = 1;
  STOPPING = 2;
  STOPPED = 3;
  ERROR = 4;
}

// Notification action request/response for shell notifications
message NotificationActionRequest {
  string notification_id = 1;
  string action_id = 2;
  string tool_name = 3;
  bytes cbor_parameters = 4;
  map<string, string> metadata = 5;
}

message NotificationActionResponse {
  string notification_id = 1;
  string action_id = 2;
  bool success = 3;
  bytes cbor_result = 4;
  string error_message = 5;
  int64 timestamp = 6;
}

// Task Planning Messages - Phase 5
message PlanRequest {
  string goal = 1;
  string context = 2;
  repeated string required_tools = 3;
  PlanPriority priority = 4;
  int64 max_execution_time = 5; // seconds
  repeated string tags = 6;
  map<string, string> metadata = 7;
}

message PlanResponse {
  string plan_id = 1;
  bool success = 2;
  string error_message = 3;
  int64 generation_time_us = 4;
  PlanData plan_data = 5;
  LlmUsageStats llm_stats = 6;
}

message PlanStatusRequest {
  string plan_id = 1;
}

message PlanStatusResponse {
  string plan_id = 1;
  bool found = 2;
  PlanData plan_data = 3;
  string error_message = 4;
}

message PlanListRequest {
  // Optional filters
  repeated string tags = 1;
  PlanStatusFilter status_filter = 2;
  int32 limit = 3;
  int32 offset = 4;
}

message PlanListResponse {
  repeated PlanSummary plans = 1;
  int32 total_count = 2;
  bool has_more = 3;
}

message PlanData {
  string id = 1;
  string name = 2;
  string description = 3;
  string user_goal = 4;
  int32 version = 5;
  PlanPriority priority = 6;
  PlanStatus status = 7;
  repeated PlanStep steps = 8;
  map<string, string> metadata = 9;
  repeated string tags = 10;
  string creator = 11;
  int64 created_at = 12;
  int64 updated_at = 13;
  int64 estimated_duration_us = 14;
  int64 actual_duration_us = 15;
}

message PlanStep {
  string id = 1;
  string name = 2;
  string description = 3;
  string step_type = 4;
  PlanPriority priority = 5;
  ExecutionStrategy execution_strategy = 6;
  PlanStepStatus status = 7;
  repeated string dependencies = 8;
  int64 estimated_duration_us = 9;
  string tool_id = 10;
  bytes tool_params_json = 11; // JSON serialized
  repeated string expected_outputs = 12;
  bytes actual_outputs_json = 13; // JSON serialized
  repeated PlanStep sub_steps = 14;
  map<string, string> metadata = 15;
}

message PlanSummary {
  string id = 1;
  string name = 2;
  string user_goal = 3;
  PlanPriority priority = 4;
  PlanStatus status = 5;
  int64 created_at = 6;
  int64 updated_at = 7;
  int32 step_count = 8;
  float progress = 9;
}

message LlmUsageStats {
  int32 input_tokens = 1;
  int32 output_tokens = 2;
  int64 inference_time_us = 3;
  string model = 4;
}

enum PlanPriority {
  PLAN_PRIORITY_LOW = 0;
  PLAN_PRIORITY_NORMAL = 1;
  PLAN_PRIORITY_HIGH = 2;
  PLAN_PRIORITY_CRITICAL = 3;
}

enum PlanStatus {
  PLAN_STATUS_GENERATING = 0;
  PLAN_STATUS_READY = 1;
  PLAN_STATUS_EXECUTING = 2;
  PLAN_STATUS_COMPLETED = 3;
  PLAN_STATUS_FAILED = 4;
  PLAN_STATUS_CANCELLED = 5;
  PLAN_STATUS_PAUSED = 6;
}

enum PlanStepStatus {
  STEP_STATUS_PENDING = 0;
  STEP_STATUS_EXECUTING = 1;
  STEP_STATUS_COMPLETED = 2;
  STEP_STATUS_FAILED = 3;
  STEP_STATUS_SKIPPED = 4;
  STEP_STATUS_BLOCKED = 5;
}

enum ExecutionStrategy {
  EXECUTION_SEQUENTIAL = 0;
  EXECUTION_PARALLEL = 1;
  EXECUTION_CONDITIONAL = 2;
  EXECUTION_RETRY = 3;
}

enum PlanStatusFilter {
  FILTER_ALL = 0;
  FILTER_ACTIVE = 1;
  FILTER_COMPLETED = 2;
  FILTER_FAILED = 3;
}

// Phase 5-A Canonical Operations
message TraceContext {
  string trace_id = 1;
  string span_id = 2;
  string parent_span_id = 3;
  map<string, string> attributes = 4;
}

message FusionRequest {
  string request_id = 1;
  string session_id = 2;
  string user_id = 3;
  Phase5Priority priority = 4;
  repeated FusionInput inputs = 5;
  map<string, string> context = 6;
  string trace_id = 7;
  uint64 max_latency_ms = 8;
  bool deterministic = 9;
  uint64 seed = 10;
}

message FusionInput {
  Modality modality = 1;
  oneof payload {
    string text = 2;
    bytes bytes = 3;
    bytes json = 4;
  }
  string mime_type = 5;
  string model_id = 6;
  map<string, string> metadata = 7;
}

message FusionResponse {
  string request_id = 1;
  string session_id = 2;
  string response_text = 3;
  repeated Modality fused_modalities = 4;
  float confidence = 5;
  PrivacyDecision privacy = 6;
  BudgetDecision budget = 7;
  string trace_id = 8;
  uint64 latency_ms = 9;
  repeated string warnings = 10;
}

message TaskGraphRequest {
  string operation = 1; // plan, execute, cancel, get
  TaskGraph graph = 2;
  string graph_id = 3;
  string goal = 4;
  string user_id = 5;
  string session_id = 6;
  TraceContext trace = 7;
}

message TaskGraphResponse {
  bool success = 1;
  string error_message = 2;
  TaskGraph graph = 3;
  TraceContext trace = 4;
}

message TaskGraph {
  string graph_id = 1;
  string goal = 2;
  repeated TaskNode nodes = 3;
  repeated TaskEdge edges = 4;
  TaskGraphStatus status = 5;
  uint64 created_at_90khz = 6;
  bytes metadata_json = 7;
}

message TaskNode {
  string node_id = 1;
  string tool_name = 2;
  bytes parameters_json = 3;
  repeated string required_capabilities = 4;
  Phase5Priority priority = 5;
  uint64 timeout_ms = 6;
}

message TaskEdge {
  string from = 1;
  string to = 2;
}

message ModelLoadRequest {
  string operation = 1; // load, verify, unload, list
  ModelManifest manifest = 2;
  string model_id = 3;
  string actor = 4;
  TraceContext trace = 5;
}

message ModelLoadResponse {
  bool success = 1;
  string error_message = 2;
  VerificationResult verification = 3;
  repeated ModelManifest models = 4;
  TraceContext trace = 5;
}

message ModelManifest {
  string model_id = 1;
  string path = 2;
  ModelFormat format = 3;
  Modality modality = 4;
  string version = 5;
  string sha256 = 6;
  uint64 size_bytes = 7;
  string license = 8;
  repeated ModelSignature signatures = 9;
  map<string, string> metadata = 10;
}

message ModelSignature {
  SignatureAlgorithm algorithm = 1;
  string public_key_b64 = 2;
  string signature_b64 = 3;
  string signer = 4;
}

message VerificationResult {
  bool hash_verified = 1;
  bool signature_verified = 2;
  bool policy_allowed = 3;
  repeated string errors = 4;
}

message PrivacyClassifyRequest {
  string request_id = 1;
  string user_id = 2;
  bytes fields_json = 3;
  RedactionMode mode = 4;
  TraceContext trace = 5;
}

message PrivacyClassifyResponse {
  PrivacyDecision decision = 1;
  TraceContext trace = 2;
}

message PrivacyDecision {
  string request_id = 1;
  repeated PrivacyFinding findings = 2;
  bytes redacted_fields_json = 3;
  bool local_only = 4;
}

message PrivacyFinding {
  string field = 1;
  string kind = 2;
  uint32 confidence = 3;
}

message BudgetReserveRequest {
  string request_id = 1;
  Phase5Priority priority = 2;
  uint32 cpu_percent = 3;
  uint64 memory_mb = 4;
  uint64 power_mw = 5;
  uint64 expected_duration_ms = 6;
  TraceContext trace = 7;
}

message BudgetReserveResponse {
  BudgetDecision decision = 1;
  TraceContext trace = 2;
}

message BudgetDecision {
  string request_id = 1;
  bool granted = 2;
  string reason = 3;
  uint64 queue_position = 4;
  uint32 active_cpu_percent = 5;
  uint64 active_memory_mb = 6;
  uint64 active_power_mw = 7;
}

message ReplayCompareRequest {
  ReplayRun expected = 1;
  ReplayRun actual = 2;
  TraceContext trace = 3;
}

message ReplayCompareResponse {
  bool equivalent = 1;
  repeated string differences = 2;
  TraceContext trace = 3;
}

message ReplayRun {
  string run_id = 1;
  repeated ReplayRecord records = 2;
  ReplayTolerance tolerance = 3;
}

message ReplayRecord {
  string event_id = 1;
  uint64 sequence = 2;
  string event_type = 3;
  bytes payload_json = 4;
  string canonical_hash = 5;
  uint64 timestamp_90khz = 6;
}

message ReplayTolerance {
  uint64 timestamp_ticks = 1;
  double float_abs = 2;
  double float_rel = 3;
}

enum Modality {
  MODALITY_TEXT = 0;
  MODALITY_AUDIO = 1;
  MODALITY_VISION = 2;
  MODALITY_JSON = 3;
}

enum Phase5Priority {
  PHASE5_PRIORITY_LOW = 0;
  PHASE5_PRIORITY_NORMAL = 1;
  PHASE5_PRIORITY_HIGH = 2;
  PHASE5_PRIORITY_URGENT = 3;
}

enum TaskGraphStatus {
  TASK_GRAPH_DRAFT = 0;
  TASK_GRAPH_READY = 1;
  TASK_GRAPH_RUNNING = 2;
  TASK_GRAPH_COMPLETED = 3;
  TASK_GRAPH_FAILED = 4;
  TASK_GRAPH_CANCELLED = 5;
}

enum ModelFormat {
  MODEL_FORMAT_ONNX = 0;
  MODEL_FORMAT_GGUF = 1;
  MODEL_FORMAT_WHISPER = 2;
  MODEL_FORMAT_HUGGING_FACE = 3;
  MODEL_FORMAT_CUSTOM = 4;
}

enum SignatureAlgorithm {
  SIGNATURE_ED25519 = 0;
  SIGNATURE_ECDSA_P256_SHA256 = 1;
}

enum RedactionMode {
  REDACTION_NONE = 0;
  REDACTION_PLACEHOLDER = 1;
  REDACTION_HASH = 2;
  REDACTION_DROP = 3;
}
