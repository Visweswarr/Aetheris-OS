[package]
name = "wallet"
version = "0.1.0"
edition = "2021"
autobins = false

[lib]
name = "wallet"
path = "src/lib.rs"

[dependencies]
# Core dependencies
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Cryptographic dependencies
secp256k1 = { version = "0.28", features = ["rand", "recovery", "global-context"] }
ed25519-dalek = { version = "2.0", features = ["rand_core"] }
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
blake3 = "1.5"
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = "0.12"
aes-gcm = "0.10"
rand = "0.8"
rand_core = "0.6"
zeroize = "1.7"

# DID and Web3 dependencies
bs58 = "0.5"

# PQC dependencies (via liboqs FFI)
libc = "0.2"

# Aetheris OS dependencies
polymera-crypto = { path = "../../crypto", features = ["full"] }
ngfs = { path = "../ngfs" }

# FFI and serialization
bincode = "1.3"
hex = "0.4"

# Async and concurrency
futures = "0.3"
async-trait = "0.1"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = "0.3"

# Configuration
toml = "0.8"

[dev-dependencies]
tempfile = "3.0"
criterion = "0.5"

[[bench]]
name = "wallet_bench"
path = "benches/wallet_bench.rs"
harness = false
