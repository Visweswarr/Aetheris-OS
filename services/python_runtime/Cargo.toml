[package]
name = "polymera-python-runtime"
version = "0.1.0"
edition = "2021"
description = "Trusted CPython boundary for Polymera AI Dev OS automation"

[lib]
name = "polymera_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
aetheris-ai-core = { path = "../ai_core" }
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py310"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
