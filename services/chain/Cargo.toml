[package]
name = "polymera-chain"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
blake3 = "1.5"
anyhow = "1"
thiserror = "1"
async-trait = "0.1"
hex = "0.4"

# Internal Polymera OS crates
polymera-crypto = { path = "../../crypto", features = ["full"] }
