[package]
name = "ai-plan-cli"
version = "0.1.0"
edition = "2021"
authors = ["Aetheris OS Team"]
description = "CLI tool for AI plan visualization and approval"
license = "MIT"
repository = "https://github.com/aetheris-os/polymera-os"

[[bin]]
name = "ai-plan"
path = "src/main.rs"

[dependencies]
# Core dependencies
tokio = { version = "1.0", features = ["full"] }
clap = { version = "4.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"

# Local dependencies
aetheris-ai = { path = "../../services/ai", features = ["phase5"] }

# HTTP client for API calls (optional)
reqwest = { version = "0.11", features = ["json"] }

[dev-dependencies]
tempfile = "3.0"