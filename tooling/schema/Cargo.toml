[package]
name = "ngfs_schema"
version = "0.1.0"
edition = "2021"
authors = ["Polymera OS Team"]
description = "NGFS Schema Hash Generator"
license = "MIT OR Apache-2.0"

[dependencies]
blake3 = "1.5"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }

[[bin]]
name = "ngfs_schema_gen"
path = "ngfs_schema.rs"
