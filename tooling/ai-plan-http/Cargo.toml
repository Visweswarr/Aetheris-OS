[package]
name = "ai-plan-http"
version = "0.1.0"
edition = "2021"
authors = ["Aetheris OS Team"]
description = "HTTP API for AI plan visualization and approval"
license = "MIT"
repository = "https://github.com/aetheris-os/polymera-os"

[[bin]]
name = "ai-plan-http"
path = "src/main.rs"

[dependencies]
# Core dependencies
tokio = { version = "1.0", features = ["full", "net"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"

# Local dependencies
aetheris-ai = { path = "../../services/ai", features = ["phase5"] }