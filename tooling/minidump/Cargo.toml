[package]
name = "minidump-decoder"
version = "0.1.0"
edition = "2021"
authors = ["Polymera OS Team"]
description = "Decoder tool for Polymera OS kernel minidumps"
license = "MIT"

[[bin]]
name = "minidump-decode"
path = "decode.rs"

[dependencies]
# No external dependencies - pure Rust implementation

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
