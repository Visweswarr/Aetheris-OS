[package]
name = "polymera-attest"
version = "0.1.0"
edition = "2021"
authors = ["Polymera OS Team"]
description = "Kernel image signing and verification tools for Polymera OS secure boot"
license = "MIT OR Apache-2.0"

[[bin]]
name = "kernel-signer"
path = "sign.rs"

[[bin]]
name = "kernel-verifier"
path = "verify.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.0"
