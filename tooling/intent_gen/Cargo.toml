[package]
name = "intent_gen"
version = "0.1.0"
edition = "2021"
authors = ["Polymera OS Team"]
description = "CBOR code generator for Intent Kernel v0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
tera = "1.19"
clap = { version = "4.0", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
anyhow = "1.0"
walkdir = "3.3"

[build-dependencies]
tera = "1.19"
