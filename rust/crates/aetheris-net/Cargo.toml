[package]
name = "aetheris-net"
version = "0.1.0"
edition = "2021"
authors = ["Aetheris OS Team"]
description = "Aetheris OS Networking Crate"
license = "MIT"
repository = "https://github.com/aetheris-os/aetheris-net"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
async-trait = "0.1"
futures = "0.3"
bytes = "1.0"
uuid = { version = "1.0", features = ["v4"] }
dashmap = "5.0"
parking_lot = "0.12"
once_cell = "1.0"
regex = "1.0"
cidr-utils = "0.6"
dns-lookup = "2.0"
libc = "0.2"
nix = { version = "0.27", features = ["socket", "net"] }

# Broker communication
aetheris-cap = { path = "../aetheris-cap" }
aetheris-policy = { path = "../../services/policy" }

[dev-dependencies]
tokio-test = "0.4"
criterion = "0.5"

[[bench]]
name = "net_performance"
harness = false
