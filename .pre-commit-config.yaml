# Pre-commit configuration for Polymera OS
# This file configures automated formatting and linting hooks

repos:
  # Pre-commit hooks repository
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      # General file checks
      - id: trailing-whitespace
        description: Remove trailing whitespace
      - id: end-of-file-fixer
        description: Ensure files end with newline
      - id: check-yaml
        description: Check YAML syntax
      - id: check-json
        description: Check JSON syntax
      - id: check-merge-conflict
        description: Check for merge conflict markers
      - id: check-case-conflict
        description: Check for case conflicts in filenames
      - id: check-added-large-files
        description: Prevent large files from being committed
        args: [--maxkb=1000]
      - id: check-ast
        description: Check Python syntax
      - id: check-docstring-first
        description: Check docstring placement
      - id: check-json
        description: Check JSON syntax
      - id: check-merge-conflict
        description: Check for merge conflict markers
      - id: check-yaml
        description: Check YAML syntax
      - id: debug-statements
        description: Check for debug statements
      - id: detect-private-key
        description: Detect private keys
      - id: end-of-file-fixer
        description: Ensure files end with newline
      - id: trailing-whitespace
        description: Remove trailing whitespace

  # Rust formatting and linting
  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black
        language_version: python3
        description: Format Python code with black
        args: [--line-length=88, --target-version=py311]

  # Python linting with ruff
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.6
    hooks:
      - id: ruff
        description: Lint Python code with ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
        description: Format Python code with ruff

  # TypeScript/JavaScript formatting and linting
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        description: Format JavaScript/TypeScript/CSS/HTML/JSON with prettier
        types: [javascript, jsx, ts, tsx, json, css, scss, html, yaml, markdown]

  # ESLint for TypeScript/JavaScript
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.56.0
    hooks:
      - id: eslint
        description: Lint JavaScript/TypeScript code with ESLint
        types: [javascript, jsx, ts, tsx]
        additional_dependencies:
          - eslint@8.56.0
          - @typescript-eslint/eslint-plugin@6.19.0
          - @typescript-eslint/parser@6.19.0
          - eslint-config-prettier@9.1.0
          - eslint-plugin-prettier@5.1.3

  # Shell script formatting
  - repo: https://github.com/mvdan/sh
    rev: v3.7.0
    hooks:
      - id: shfmt
        description: Format shell scripts with shfmt
        args: [-i, 2, -ci, -sr]

  # Go formatting and linting (if Go code exists)
  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.5.1
    hooks:
      - id: go-fmt
        description: Format Go code with gofmt
      - id: go-vet
        description: Vet Go code
      - id: go-imports
        description: Update Go imports
      - id: golangci-lint
        description: Lint Go code with golangci-lint
        args: [--timeout=5m]

  # Rust-specific hooks
  - repo: https://github.com/pre-commit/mirrors-rust
    rev: v1.75.0
    hooks:
      - id: rustfmt
        description: Format Rust code with rustfmt
        args: [--edition, 2021]
      - id: clippy
        description: Lint Rust code with clippy
        args: [--all-targets, --all-features, --, -D, warnings]

  # Markdown linting
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.37.0
    hooks:
      - id: markdownlint
        description: Lint Markdown files
        args: [--fix]

  # TOML linting
  - repo: https://github.com/taiki-e/taiki-e
    rev: v1.0.0
    hooks:
      - id: taplo
        description: Format TOML files with taplo

  # YAML linting
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.33.0
    hooks:
      - id: yamllint
        description: Lint YAML files
