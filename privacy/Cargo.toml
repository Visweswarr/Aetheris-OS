[package]
name = "polymera-privacy"
version = "0.1.0"
edition = "2021"
description = "Privacy Budget System for Polymera OS - Differential privacy protection through token bucket rate limiting"
license = "MIT OR Apache-2.0"
repository = "https://github.com/polymera-os/polymera-os"
keywords = ["privacy", "differential-privacy", "rate-limiting", "token-bucket", "budget", "middleware"]
categories = ["security", "web-programming", "asynchronous"]
readme = "README.md"

[dependencies]
# Async runtime
tokio = { version = "1.0", features = ["full", "sync"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"

# Error handling
thiserror = "1.0"

# UUID generation
uuid = { version = "1.0", features = ["v4"] }

# Random number generation
rand = "0.8"

# Logging
log = "0.4"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Regular expressions
regex = "1.0"

# Optional web framework integrations
actix-web = { version = "4.0", optional = true, features = ["macros"] }
axum = { version = "0.7", optional = true }

[dev-dependencies]
# Testing
tokio-test = "0.4"
tempfile = "3.8"

# Mocking
mockall = "0.11"

# Test utilities
assert_fs = "1.0"
predicates = "3.0"

# Serialization testing
serde_test = "1.0"

[features]
default = []
# Enable Actix-web integration
actix-web = ["dep:actix-web"]
# Enable Axum integration
axum = ["dep:axum"]
# Enable all integrations
all-integrations = ["actix-web", "axum"]
# Enable additional security features
security = []
# Enable performance optimizations
performance = []
# Enable development features
dev = ["security", "performance"]

[profile.release]
# Optimize for performance
opt-level = 3
# Enable link-time optimization
lto = true
# Strip debug symbols
strip = true
# Enable panic = "abort" for smaller binary
panic = "abort"

[profile.dev]
# Enable debug assertions
debug = true
# Enable overflow checks
overflow-checks = true

# Build optimizations
[profile.dev.package."*"]
opt-level = 1
