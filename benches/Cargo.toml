[package]
name = "ai_core_bench"
version = "0.1.0"
edition = "2021"

[[bench]]
name = "ai_core_bench"
harness = false

[dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
